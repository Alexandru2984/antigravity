[package]
name = "listing-service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "listing-service"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["multipart", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "request-id", "util"] }
tokio = { version = "1", features = ["full"] }

# MongoDB — v3 dropped the bson-chrono feature; chrono is handled natively
mongodb = "3"
bson = { version = "2", features = ["chrono-0_4"] }

# Kafka
rdkafka = { version = "0.36", features = ["cmake-build"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Validation
validator = { version = "0.20", features = ["derive"] }

# OpenTelemetry — use the stable 0.22 series
opentelemetry = "0.22"
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.15", features = ["grpc-tonic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.23"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
dotenvy = "0.15"
futures = "0.3"

# Note: Redis not used in listing-service (no caching layer needed at MVP)

[dev-dependencies]
axum-test = "14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
