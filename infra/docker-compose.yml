version: "3.9"

# ============================================================
# PolyMarket — Infrastructure Stack
# All databases + Kafka + MinIO + tooling
# Run: docker compose -f infra/docker-compose.yml up -d
# ============================================================

networks:
  polymarket:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  mysql_data:
  redis_data:
  clickhouse_data:
  opensearch_data:
  timescale_data:
  neo4j_data:
  surrealdb_data:
  kafka_data:
  zookeeper_data:
  minio_data:
  kafka_ui_data:

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  # Used by: auth-service, payment-service, profile-service,
  #          config-service, admin-panel, chat-service
  postgres:
    image: postgres:16-alpine
    container_name: polymarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: polymarket
      POSTGRES_PASSWORD: polymarket_dev
      POSTGRES_DB: polymarket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - polymarket
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polymarket"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB ─────────────────────────────────────────────────
  # Used by: listing-service (flexible schema per category)
  mongo:
    image: mongo:7
    container_name: polymarket-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: polymarket
      MONGO_INITDB_ROOT_PASSWORD: polymarket_dev
      MONGO_INITDB_DATABASE: polymarket
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./db/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - polymarket
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MySQL ───────────────────────────────────────────────────
  # Used by: review-service (Laravel RAD, tabular reviews)
  mysql:
    image: mysql:8.3
    container_name: polymarket-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev
      MYSQL_DATABASE: polymarket_reviews
      MYSQL_USER: polymarket
      MYSQL_PASSWORD: polymarket_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - polymarket
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "polymarket", "-ppolymarket_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────
  # Used by: api-gateway (sessions), auth-service (refresh tokens),
  #          notification-service (pub/sub + store), feed-service (cache)
  redis:
    image: redis:7.2-alpine
    container_name: polymarket-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass polymarket_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - polymarket
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "polymarket_dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ClickHouse ──────────────────────────────────────────────
  # Used by: analytics-service, stream-processor (OLAP columnar)
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: polymarket-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: polymarket
      CLICKHOUSE_PASSWORD: polymarket_dev
      CLICKHOUSE_DB: polymarket_analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native TCP
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./db/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - polymarket
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user polymarket --password polymarket_dev --query 'SELECT 1'"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── OpenSearch ──────────────────────────────────────────────
  # Used by: search-service (full-text + geo search + faceted)
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: polymarket-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Polymarket_Dev1!
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - polymarket
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -v '\"status\":\"red\"'"]
      interval: 20s
      timeout: 10s
      retries: 5

  # OpenSearch Dashboard
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: polymarket-opensearch-dashboards
    restart: unless-stopped
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    networks:
      - polymarket
    depends_on:
      opensearch:
        condition: service_healthy

  # ── TimescaleDB ─────────────────────────────────────────────
  # Used by: stream-processor (time-series metrics, KPIs)
  timescale:
    image: timescale/timescaledb:latest-pg16
    container_name: polymarket-timescale
    restart: unless-stopped
    environment:
      POSTGRES_USER: polymarket
      POSTGRES_PASSWORD: polymarket_dev
      POSTGRES_DB: polymarket_metrics
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./db/timescale/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - polymarket
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polymarket"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Neo4j ───────────────────────────────────────────────────
  # Used by: ml-service (recommendation graph, co-purchase)
  neo4j:
    image: neo4j:5.18-community
    container_name: polymarket-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/polymarket_dev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    networks:
      - polymarket
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── SurrealDB ───────────────────────────────────────────────
  # Used by: feed-service (social graph: follows, favorites, activity)
  surrealdb:
    image: surrealdb/surrealdb:v1.5.4
    container_name: polymarket-surrealdb
    restart: unless-stopped
    command: start --user polymarket --pass polymarket_dev file:/data/polymarket.db
    ports:
      - "8000:8000"
    volumes:
      - surrealdb_data:/data
    networks:
      - polymarket
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka + Zookeeper ───────────────────────────────────────
  # Event spine for all services
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: polymarket-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper
    networks:
      - polymarket
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: polymarket-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168   # 7 days
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - polymarket
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Kafka UI — topic browser + consumer lag monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: polymarket-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: polymarket
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8080:8080"
    networks:
      - polymarket

  # ── MinIO ───────────────────────────────────────────────────
  # S3-compatible object storage: listing images, avatars, documents
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: polymarket-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniominio
    ports:
      - "9000:9000"   # S3 API  ← NOTE: conflicts with ClickHouse native if both on 9000
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    networks:
      - polymarket
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
