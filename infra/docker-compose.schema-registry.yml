# ============================================================
# PolyMarket — Apicurio Schema Registry (Kafka contracts)
# Avro/Protobuf/JSON schemas for the event spine. KafkaSQL storage
# keeps schemas durable in a Kafka topic (no extra database).
# Run together with the infra stack:
#   docker compose -f infra/docker-compose.yml \
#     -f infra/docker-compose.schema-registry.yml up -d schema-registry
# ============================================================

networks:
  polymarket:
    external: true

services:
  schema-registry:
    security_opt:
      - no-new-privileges:true
    image: apicurio/apicurio-registry-kafkasql:2.6.5.Final
    container_name: polymarket-schema-registry
    restart: unless-stopped
    mem_limit: 512m
    expose:
      - "8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Enforce backward-compatible schema evolution by default on every artifact.
      REGISTRY_RULES_GLOBAL_COMPATIBILITY: BACKWARD
      REGISTRY_RULES_GLOBAL_VALIDITY: FULL
      QUARKUS_HTTP_PORT: 8080
    networks:
      - polymarket
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
