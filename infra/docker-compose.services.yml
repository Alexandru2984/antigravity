# ============================================================
# PolyMarket — Application Services
# All 18 microservices
# Run with infrastructure definitions:
# docker compose -f infra/docker-compose.yml -f infra/docker-compose.services.yml up -d
# ============================================================

networks:
  polymarket:
    external: true

x-stateful-security: &stateful_security
  security_opt:
    - no-new-privileges:true

x-app-security: &app_security
  <<: *stateful_security
  cap_drop:
    - ALL

services:

  # ── API Gateway (Node.js / NestJS) ─────────────────────────
  api-gateway:
    <<: *app_security
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    container_name: polymarket-api-gateway
    restart: unless-stopped
    mem_limit: 300m
    expose:
      - "4000"
    environment:
      PORT: 4000
      NODE_ENV: development
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      POLYGLOT_MESH_ENABLED: ${POLYGLOT_MESH_ENABLED:?POLYGLOT_MESH_ENABLED is required}
      POLYGLOT_MESH_MAX_CONCURRENCY: ${POLYGLOT_MESH_MAX_CONCURRENCY:-2}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      AUTH_SERVICE_URL: http://auth-service:4001
      LISTING_SERVICE_URL: http://listing-service:4002
      SEARCH_SERVICE_URL: http://search-service:4003
      IMAGE_SERVICE_URL: http://image-service:4004
      NOTIFICATION_SERVICE_URL: http://notification-service:4005
      PAYMENT_SERVICE_URL: http://payment-service:4006
      PROFILE_SERVICE_URL: http://profile-service:4007
      FEED_SERVICE_URL: http://feed-service:4008
      REVIEW_SERVICE_URL: http://review-service:4009
      ANALYTICS_SERVICE_URL: http://analytics-service:4010
      CHAT_SERVICE_URL: http://chat-service:4011
      ML_SERVICE_URL: http://ml-service:4012
      CONTRACT_VALIDATOR_URL: http://contract-validator:4035
      BRAINFUCK_SERVICE_URL: http://brainfuck-service:4020
      ASSEMBLY_SERVICE_URL: http://assembly-service:4021
      COBOL_SERVICE_URL: http://cobol-service:4022
      CLOJURE_SERVICE_URL: http://clojure-service:4023
      JULIA_SERVICE_URL: http://julia-service:4054
      PROLOG_SERVICE_URL: http://prolog-service:4055
      ELIXIR_SERVICE_URL: http://elixir-service:4057
      LUA_SERVICE_URL: http://lua-service:4059
      R_SERVICE_URL: http://r-service:4060
      ZIG_SERVICE_URL: http://zig-service:4062
      NIM_SERVICE_URL: http://nim-service:4064
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: api-gateway
    networks:
      - polymarket
    depends_on:
      auth-service:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Auth Service (Elixir / Phoenix) ─────────────────────────
  auth-service:
    <<: *app_security
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    container_name: polymarket-auth
    restart: unless-stopped
    mem_limit: 300m
    expose:
      - "4001"
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://polymarket:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polymarket_auth
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      MIX_ENV: dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    networks:
      - polymarket
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── Listing Service (Rust / Axum) ───────────────────────────
  listing-service:
    <<: *app_security
    build:
      context: ../services/listing-service
      dockerfile: Dockerfile
    container_name: polymarket-listing
    restart: unless-stopped
    mem_limit: 300m
    expose:
      - "4002"
    environment:
      PORT: 4002
      MONGO_URI: mongodb://polymarket:${MONGO_PASSWORD:?MONGO_PASSWORD is required}@mongo:27017/polymarket?authSource=admin
      MONGO_DB: polymarket
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      IMAGE_PUBLIC_PATH_PREFIX: ${IMAGE_PUBLIC_PATH_PREFIX:-/api/v1/images}
      RUST_LOG: info
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    networks:
      - polymarket
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── Search Service (Java / Spring Boot) ─────────────────────
  search-service:
    <<: *app_security
    build:
      context: ../services/search-service
      dockerfile: Dockerfile
    container_name: polymarket-search
    restart: unless-stopped
    mem_limit: 700m
    expose:
      - "4003"
    environment:
      SERVER_PORT: 4003
      SPRING_PROFILES_ACTIVE: dev
      OPENSEARCH_URI: https://opensearch:9200
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?OPENSEARCH_INITIAL_ADMIN_PASSWORD is required}
      OPENSEARCH_SSL_TRUST_ALL: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
    networks:
      - polymarket
    depends_on:
      opensearch:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── Image Service (C++ / Drogon) ────────────────────────────
  image-service:
    <<: *app_security
    build:
      context: ../services/image-service
      dockerfile: Dockerfile
    container_name: polymarket-image
    restart: unless-stopped
    mem_limit: 400m
    expose:
      - "4004"
    environment:
      HTTP_PORT: 4004
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET_IMAGES: listings-images
      MINIO_BUCKET_AVATARS: avatars
      KAFKA_BROKERS: kafka:29092
      MAX_UPLOAD_SIZE_MB: 10
    networks:
      - polymarket
    depends_on:
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── Notification Service (Elixir / Phoenix Channels) ────────
  notification-service:
    <<: *app_security
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile
    container_name: polymarket-notification
    restart: unless-stopped
    mem_limit: 300m
    expose:
      - "4005"
    environment:
      PORT: 4005
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      KAFKA_BROKERS: kafka:29092
      SECRET_KEY_BASE: ${NOTIFICATION_SECRET_KEY_BASE:?NOTIFICATION_SECRET_KEY_BASE is required}
      MIX_ENV: dev
    networks:
      - polymarket
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── Payment Service (C# / ASP.NET Core) ─────────────────────
  payment-service:
    <<: *app_security
    build:
      context: ../services/payment-service
      dockerfile: Dockerfile
    container_name: polymarket-payment
    restart: unless-stopped
    mem_limit: 300m
    expose:
      - "4006"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:4006
      DATABASE_URL: "Host=postgres;Database=polymarket_payments;Username=polymarket;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      Stripe__SecretKey: "${STRIPE_SECRET_KEY}"
      Stripe__WebhookSecret: "${STRIPE_WEBHOOK_SECRET}"
      Kafka__BootstrapServers: kafka:29092
      OTEL__Endpoint: http://otel-collector:4317
    networks:
      - polymarket
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── Profile Service (Kotlin / Ktor) ─────────────────────────
  profile-service:
    <<: *app_security
    build:
      context: ../services/profile-service
      dockerfile: Dockerfile
    container_name: polymarket-profile
    restart: unless-stopped
    mem_limit: 600m
    expose:
      - "4007"
    environment:
      PORT: 4007
      PROFILE_DATABASE_URL: jdbc:postgresql://postgres:5432/polymarket_profiles
      POSTGRES_USER: polymarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      IMAGE_SERVICE_URL: http://image-service:4004
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    networks:
      - polymarket
    depends_on:
      postgres:
        condition: service_healthy

  # ── Feed Service (Go / chi) ──────────────────────────────────
  feed-service:
    <<: *app_security
    build:
      context: ../services/feed-service
      dockerfile: Dockerfile
    container_name: polymarket-feed
    restart: unless-stopped
    mem_limit: 200m
    expose:
      - "4008"
    environment:
      PORT: 4008
      SURREALDB_URL: ws://surrealdb:8000/rpc
      SURREALDB_USER: polymarket
      SURREALDB_PASS: ${SURREALDB_PASSWORD:?SURREALDB_PASSWORD is required}
      SURREALDB_NS: polymarket
      SURREALDB_DB: feed
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      KAFKA_BROKERS: kafka:29092
    networks:
      - polymarket
    depends_on:
      surrealdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── Review Service (PHP / Laravel) ──────────────────────────
  review-service:
    <<: *app_security
    build:
      context: ../services/review-service
      dockerfile: Dockerfile
    container_name: polymarket-review
    restart: unless-stopped
    mem_limit: 300m
    expose:
      - "4009"
    environment:
      APP_ENV: local
      APP_KEY: ${REVIEW_APP_KEY:?REVIEW_APP_KEY is required}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: polymarket_reviews
      DB_USERNAME: polymarket
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      KAFKA_BROKERS: kafka:29092
    networks:
      - polymarket
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── Analytics Service (Python / FastAPI) ────────────────────
  analytics-service:
    <<: *app_security
    build:
      context: ../services/analytics-service
      dockerfile: Dockerfile
    container_name: polymarket-analytics
    restart: unless-stopped
    mem_limit: 300m
    expose:
      - "4010"
    environment:
      PORT: 4010
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: polymarket
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_DB: polymarket_analytics
      KAFKA_BROKERS: kafka:29092
    networks:
      - polymarket
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── Chat Service (Elixir / Phoenix) ─────────────────────────
  chat-service:
    <<: *app_security
    build:
      context: ../services/chat-service
      dockerfile: Dockerfile
    container_name: polymarket-chat
    restart: unless-stopped
    mem_limit: 400m
    expose:
      - "4011"
    environment:
      PORT: 4011
      DATABASE_URL: postgresql://polymarket:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polymarket_chat
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      KAFKA_BROKERS: kafka:29092
      SECRET_KEY_BASE: ${CHAT_SECRET_KEY_BASE:?CHAT_SECRET_KEY_BASE is required}
      MIX_ENV: dev
    networks:
      - polymarket
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── ML Service (Python / FastAPI) ───────────────────────────
  ml-service:
    <<: *app_security
    build:
      context: ../services/ml-service
      dockerfile: Dockerfile
    container_name: polymarket-ml
    restart: unless-stopped
    mem_limit: 600m
    expose:
      - "4012"
    environment:
      PORT: 4012
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      KAFKA_BROKERS: kafka:29092
    networks:
      - polymarket
    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── Stream Processor (Scala / Akka Streams) ─────────────────
  stream-processor:
    <<: *app_security
    build:
      context: ../services/stream-processor
      dockerfile: Dockerfile
    container_name: polymarket-stream
    restart: unless-stopped
    mem_limit: 600m
    expose:
      - "4013"
    environment:
      HTTP_PORT: 4013
      KAFKA_BROKERS: kafka:29092
      TIMESCALE_URL: jdbc:postgresql://timescale:5432/polymarket_metrics
      TIMESCALE_USER: polymarket
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:?TIMESCALE_PASSWORD is required}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
    networks:
      - polymarket
    depends_on:
      kafka:
        condition: service_healthy
      timescale:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  # ── Config Service (F# / Giraffe) ───────────────────────────
  config-service:
    <<: *app_security
    build:
      context: ../services/config-service
      dockerfile: Dockerfile
    container_name: polymarket-config
    restart: unless-stopped
    mem_limit: 250m
    expose:
      - "4014"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:4014
      ConnectionStrings__Postgres: "Host=postgres;Database=polymarket_config;Username=polymarket;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    networks:
      - polymarket
    depends_on:
      postgres:
        condition: service_healthy

  # ── Contract Validator (Haskell / Servant) ──────────────────
  contract-validator:
    <<: *app_security
    build:
      context: ../services/contract-validator
      dockerfile: Dockerfile
    container_name: polymarket-contract
    restart: unless-stopped
    mem_limit: 500m
    expose:
      - "4035"
    environment:
      PORT: 4035
      # Validates OpenAPI specs at deploy time
      SPECS_DIR: /app/contracts
    volumes:
      - ../contracts:/app/contracts:ro
    networks:
      - polymarket

  # ── Admin Panel (Ruby / Rails) ───────────────────────────────
  admin-panel:
    <<: *app_security
    build:
      context: ../services/admin-panel
      dockerfile: Dockerfile
    container_name: polymarket-admin
    restart: unless-stopped
    mem_limit: 500m
    expose:
      - "4016"
    environment:
      RAILS_ENV: development
      PORT: 4016
      DATABASE_URL: postgresql://polymarket:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polymarket_admin
      SECRET_KEY_BASE: ${ADMIN_SECRET_KEY_BASE:?ADMIN_SECRET_KEY_BASE is required}
      AUTH_SERVICE_URL: http://auth-service:4001
    networks:
      - polymarket
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend (Next.js) ───────────────────────────────────────
  frontend:
    <<: *app_security
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: polymarket-frontend
    restart: unless-stopped
    mem_limit: 400m
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
      NEXT_PUBLIC_STRIPE_PK: "${STRIPE_PUBLISHABLE_KEY}"
      NODE_ENV: development
    networks:
      - polymarket
    depends_on:
      api-gateway:
        condition: service_started

  # ── Public Edge (Nginx) ─────────────────────────────────────
  nginx:
    <<: *stateful_security
    image: nginx:1.27-alpine
    container_name: polymarket-nginx
    restart: unless-stopped
    mem_limit: 100m
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - polymarket
    depends_on:
      api-gateway:
        condition: service_started
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Polyglot Mesh Demo Workers ──────────────────────────────
  brainfuck-service:
    <<: *app_security
    build:
      context: ../services/brainfuck-service
      dockerfile: Dockerfile
    container_name: polymarket-brainfuck
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - polymarket

  assembly-service:
    <<: *app_security
    build:
      context: ../services/assembly-service
      dockerfile: Dockerfile
    container_name: polymarket-assembly
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - polymarket

  cobol-service:
    <<: *app_security
    build:
      context: ../services/cobol-service
      dockerfile: Dockerfile
    container_name: polymarket-cobol
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - polymarket

  clojure-service:
    <<: *app_security
    build:
      context: ../services/clojure-service
      dockerfile: Dockerfile
    container_name: polymarket-clojure
    restart: unless-stopped
    mem_limit: 400m
    networks:
      - polymarket

  julia-service:
    <<: *app_security
    build:
      context: ../services/julia-service
      dockerfile: Dockerfile
    container_name: polymarket-julia
    restart: unless-stopped
    mem_limit: 400m
    networks:
      - polymarket

  prolog-service:
    <<: *app_security
    build:
      context: ../services/prolog-service
      dockerfile: Dockerfile
    container_name: polymarket-prolog
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - polymarket

  elixir-service:
    <<: *app_security
    build:
      context: ../services/elixir-service
      dockerfile: Dockerfile
    container_name: polymarket-elixir-mesh
    restart: unless-stopped
    mem_limit: 200m
    networks:
      - polymarket

  scala-service:
    <<: *app_security
    build:
      context: ../services/scala-service
      dockerfile: Dockerfile
    container_name: polymarket-scala-mesh
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - polymarket

  lua-service:
    <<: *app_security
    build:
      context: ../services/lua-service
      dockerfile: Dockerfile
    container_name: polymarket-lua
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - polymarket

  r-service:
    <<: *app_security
    build:
      context: ../services/r-service
      dockerfile: Dockerfile
    container_name: polymarket-r
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - polymarket

  php-service:
    <<: *app_security
    build:
      context: ../services/php-service
      dockerfile: Dockerfile
    container_name: polymarket-php-mesh
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - polymarket

  zig-service:
    <<: *app_security
    build:
      context: ../services/zig-service
      dockerfile: Dockerfile
    container_name: polymarket-zig
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - polymarket

  nim-service:
    <<: *app_security
    build:
      context: ../services/nim-service
      dockerfile: Dockerfile
    container_name: polymarket-nim
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - polymarket

  swift-service:
    <<: *app_security
    build:
      context: ../services/swift-service
      dockerfile: Dockerfile
    container_name: polymarket-swift
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - polymarket

  haskell-service:
    <<: *app_security
    build:
      context: ../services/haskell-service
      dockerfile: Dockerfile
    container_name: polymarket-haskell-mesh
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - polymarket
