# East-west segmentation for the polymarket namespace (enforced in-kernel by
# Cilium). Default-deny ingress, then allow only same-namespace traffic, the
# Linkerd control plane, and DNS egress. Recreates the frontend/backend/data
# isolation the old Compose stack had, but kernel-enforced.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: polymarket
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: polymarket
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: polymarket
        # Linkerd control plane (mTLS identity/tap) must reach the proxies.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkerd
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: polymarket
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    # DNS to CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # All other egress (DBs on Compose, upstreams) — tighten per-service later.
    - {}
