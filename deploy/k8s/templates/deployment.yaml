{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "polymarket.labels" $ | nindent 4 }}
    app: {{ $name }}
spec:
  {{- if not (hasKey $svc "hpa") }}
  replicas: {{ $svc.replicas | default 1 }}
  {{- end }}
  # Zero-downtime updates: surge a new pod and wait for it Ready before retiring
  # the old one (works even at 1 replica). Linkerd keeps mTLS across the swap.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      # Avoid Docker-link-style {SVC}_PORT/{SVC}_SERVICE_* env injection clashing
      # with app config; services discover each other via DNS.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: {{ $svc.runAsNonRoot | default false }}
      containers:
        - name: {{ $name }}
          image: {{ $svc.image }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "IfNotPresent" }}
          {{- if $svc.port }}
          ports:
            - containerPort: {{ $svc.port }}
          {{- end }}
          {{- if or $svc.env $svc.envSecret }}
          env:
            {{- /* secret-sourced vars first so plain values can reference them via $(VAR) */}}
            {{- range $svc.envSecret }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secretName | default "polymarket-secrets" }}
                  key: {{ .key }}
            {{- end }}
            {{- range $svc.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- end }}
          resources:
            requests:
              cpu: {{ $svc.cpuRequest | default "25m" }}
              memory: {{ $svc.memRequest | default "64Mi" }}
            limits:
              memory: {{ $svc.memLimit | default "256Mi" }}
          {{- if $svc.healthPath }}
          readinessProbe:
            httpGet: { path: {{ $svc.healthPath }}, port: {{ $svc.port }} }
            initialDelaySeconds: {{ $svc.healthDelay | default 10 }}
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: {{ $svc.healthPath }}, port: {{ $svc.port }} }
            initialDelaySeconds: {{ $svc.healthDelay | default 20 }}
            periodSeconds: 20
          {{- end }}
{{- end }}
{{- end }}
