# PolyMarket umbrella chart values.
# Each entry under `services` renders a Deployment (+ Service if it has a port).
# Images are the locally-built infra-* images imported into K3s containerd
# (see deploy/k8s/import-images.sh). Flip `enabled` to bring a service onto k8s.
#
# Migration strategy (Faza 1): stateless polyglot mesh workers move first; the
# stateful databases stay on Docker Compose and are reached via externalDatabases
# until they are migrated to StatefulSets in a later step.

global:
  imagePullPolicy: IfNotPresent
  secretName: polymarket-secrets

# k8s-owned stateful backing stores (StatefulSets + PVCs). The cluster runs its
# OWN databases, restored from backup — independent of the Compose databases
# still serving live traffic. Brought up in waves (Faza 1c). Mirrors the env in
# infra/docker-compose.yml. Flip `enabled` per store.
databases:
  postgres:
    enabled: true
    image: postgres:16-alpine
    dataPath: /var/lib/postgresql/data
    pvcSize: 3Gi
    memLimit: 512Mi
    ports: [{ name: pg, port: 5432 }]
    env:
      - { name: POSTGRES_USER, value: polymarket }
      - { name: POSTGRES_DB, value: polymarket }
      - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
    envSecret:
      - { name: POSTGRES_PASSWORD, key: POSTGRES_PASSWORD }
    readinessExec: ["pg_isready", "-U", "polymarket"]
  mongo:
    enabled: true
    image: mongo:7
    dataPath: /data/db
    pvcSize: 3Gi
    memLimit: 512Mi
    ports: [{ name: mongo, port: 27017 }]
    env:
      - { name: MONGO_INITDB_ROOT_USERNAME, value: polymarket }
      - { name: MONGO_INITDB_DATABASE, value: polymarket }
    envSecret:
      - { name: MONGO_INITDB_ROOT_PASSWORD, key: MONGO_PASSWORD }
    readinessExec: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
  redis:
    enabled: true
    image: redis:7.2-alpine
    dataPath: /data
    pvcSize: 1Gi
    memLimit: 300Mi
    ports: [{ name: redis, port: 6379 }]
    command: ["sh", "-c"]
    args: ["redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
    envSecret:
      - { name: REDIS_PASSWORD, key: REDIS_PASSWORD }
    readinessExec: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping"]

  # ── Wave B: event spine + remaining stores ─────────────────
  zookeeper:
    enabled: true
    image: confluentinc/cp-zookeeper:7.6.1
    dataPath: /var/lib/zookeeper
    pvcSize: 1Gi
    memLimit: 400Mi
    ports: [{ name: zk, port: 2181 }]
    dataPort: 2181
    # Event spine excluded from the mesh: Kafka's protocol + ClusterIP
    # self-connection don't survive Linkerd's sidecar; app->kafka still works.
    annotations: { linkerd.io/inject: disabled }
    env:
      - { name: ZOOKEEPER_CLIENT_PORT, value: "2181" }
      - { name: ZOOKEEPER_TICK_TIME, value: "2000" }
  kafka:
    enabled: true
    image: confluentinc/cp-kafka:7.6.1
    dataPath: /var/lib/kafka/data
    pvcSize: 4Gi
    memLimit: 1200Mi
    cpuRequest: 100m
    ports: [{ name: internal, port: 29092 }, { name: host, port: 9092 }]
    annotations: { linkerd.io/inject: disabled }
    # Headless: the broker advertises kafka:29092 and must reach itself there;
    # a ClusterIP VIP self-connection (hairpin) fails, a direct pod IP works.
    headless: true
    env:
      - { name: KAFKA_BROKER_ID, value: "1" }
      - { name: KAFKA_ZOOKEEPER_CONNECT, value: "zookeeper:2181" }
      - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092" }
      - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT" }
      - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
      - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
      - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
      - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
      - { name: KAFKA_LOG_RETENTION_HOURS, value: "168" }
      - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
    readinessExec: ["kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
    readyDelay: 30
  mysql:
    enabled: true
    image: mysql:8.3
    dataPath: /var/lib/mysql
    pvcSize: 2Gi
    memLimit: 700Mi
    ports: [{ name: mysql, port: 3306 }]
    envSecret:
      - { name: MYSQL_ROOT_PASSWORD, key: MYSQL_ROOT_PASSWORD }
      - { name: MYSQL_PASSWORD, key: MYSQL_PASSWORD }
    env:
      - { name: MYSQL_DATABASE, value: polymarket_reviews }
      - { name: MYSQL_USER, value: polymarket }
    readinessExec: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
    readyDelay: 20
  clickhouse:
    enabled: true
    image: clickhouse/clickhouse-server:24.3-alpine
    dataPath: /var/lib/clickhouse
    pvcSize: 2Gi
    memLimit: 1Gi
    ports: [{ name: http, port: 8123 }, { name: native, port: 9000 }]
    envSecret:
      - { name: CLICKHOUSE_PASSWORD, key: CLICKHOUSE_PASSWORD }
    env:
      - { name: CLICKHOUSE_USER, value: polymarket }
      - { name: CLICKHOUSE_DB, value: polymarket_analytics }
      - { name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1" }
    readinessExec: ["sh", "-c", "clickhouse-client --user polymarket --password \"$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
    readyDelay: 15
  timescale:
    enabled: true
    image: timescale/timescaledb:2.27.1-pg16
    dataPath: /var/lib/postgresql/data
    pvcSize: 2Gi
    memLimit: 700Mi
    ports: [{ name: pg, port: 5432 }]
    envSecret:
      - { name: POSTGRES_PASSWORD, key: TIMESCALE_PASSWORD }
    env:
      - { name: POSTGRES_USER, value: polymarket }
      - { name: POSTGRES_DB, value: polymarket_metrics }
      - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
    readinessExec: ["pg_isready", "-U", "polymarket"]
  neo4j:
    enabled: true
    image: neo4j:5.18-community
    dataPath: /data
    pvcSize: 2Gi
    memLimit: 1Gi
    ports: [{ name: http, port: 7474 }, { name: bolt, port: 7687 }]
    # Password var is NOT NEO4J_-prefixed: neo4j parses any NEO4J_* env as a
    # config setting and rejects unknown ones. GRAPH_PW feeds NEO4J_AUTH via $(VAR).
    envSecret:
      - { name: GRAPH_PW, key: NEO4J_PASSWORD }
    env:
      - { name: NEO4J_AUTH, value: "neo4j/$(GRAPH_PW)" }
      - { name: NEO4J_PLUGINS, value: "[\"apoc\"]" }
      - { name: NEO4J_server_memory_heap_initial__size, value: "256m" }
      - { name: NEO4J_server_memory_heap_max__size, value: "512m" }
    readinessExec: ["sh", "-c", "cypher-shell -u neo4j -p \"$GRAPH_PW\" 'RETURN 1'"]
    readyDelay: 25
  surrealdb:
    enabled: true
    image: surrealdb/surrealdb:v1.5.4
    dataPath: /data
    pvcSize: 1Gi
    memLimit: 256Mi
    ports: [{ name: ws, port: 8000 }]
    dataPort: 8000
    # surreal runs as uid 65532; fsGroup makes the local-path PVC writable for it.
    securityContext: { runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532 }
    command: ["/surreal"]
    args: ["start", "--auth", "--user", "polymarket", "--pass", "$(SURREALDB_PASSWORD)", "file:/data/polymarket.db"]
    envSecret:
      - { name: SURREALDB_PASSWORD, key: SURREALDB_PASSWORD }
    readyDelay: 10
  minio:
    enabled: true
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    dataPath: /data
    pvcSize: 3Gi
    memLimit: 512Mi
    ports: [{ name: s3, port: 9000 }, { name: console, port: 9001 }]
    dataPort: 9000
    command: ["sh", "-c"]
    args: ["minio server /data --console-address ':9001'"]
    envSecret:
      - { name: MINIO_ROOT_USER, key: MINIO_ROOT_USER }
      - { name: MINIO_ROOT_PASSWORD, key: MINIO_ROOT_PASSWORD }
  opensearch:
    enabled: true
    image: opensearchproject/opensearch:2.13.0
    dataPath: /usr/share/opensearch/data
    pvcSize: 3Gi
    memLimit: 1600Mi
    cpuRequest: 100m
    ports: [{ name: http, port: 9200 }, { name: perf, port: 9600 }]
    securityContext: { fsGroup: 1000 }
    envSecret:
      - { name: OPENSEARCH_INITIAL_ADMIN_PASSWORD, key: OPENSEARCH_INITIAL_ADMIN_PASSWORD }
    env:
      - { name: discovery.type, value: single-node }
      - { name: OPENSEARCH_JAVA_OPTS, value: "-Xms512m -Xmx512m" }
      - { name: DISABLE_INSTALL_DEMO_CONFIG, value: "false" }
    dataPort: 9200
    readyDelay: 30

services:
  # ── Pilot set (varied languages, stateless, on k8s now) ─────
  contract-validator:
    enabled: true
    image: docker.io/library/infra-contract-validator:latest
    port: 4035
    healthPath: /health
    memLimit: 256Mi
  elixir-service:
    enabled: true
    image: docker.io/library/infra-elixir-service:latest
    port: 4057
    healthPath: /health
    env:
      - { name: PORT, value: "4057" }
    memLimit: 200Mi
  zig-service:
    enabled: true
    image: docker.io/library/infra-zig-service:latest
    port: 4062
    memLimit: 64Mi
  prolog-service:
    enabled: true
    image: docker.io/library/infra-prolog-service:latest
    port: 4055
    memLimit: 128Mi

  # ── Remaining mesh workers (stateless; flip enabled) ────────
  brainfuck-service:   { enabled: true, image: docker.io/library/infra-brainfuck-service:latest,   port: 4020, memLimit: 64Mi }
  assembly-service:    { enabled: true, image: docker.io/library/infra-assembly-service:latest,    port: 4021, memLimit: 128Mi }
  cobol-service:       { enabled: true, image: docker.io/library/infra-cobol-service:latest,       port: 4022, memLimit: 64Mi }
  clojure-service:     { enabled: true, image: docker.io/library/infra-clojure-service:latest,     port: 4023, memLimit: 400Mi }
  julia-service:       { enabled: true, image: docker.io/library/infra-julia-service:latest,       port: 4054, memLimit: 400Mi }
  scala-service:       { enabled: true, image: docker.io/library/infra-scala-service:latest,       port: 4058, healthPath: /health, memLimit: 512Mi }
  lua-service:         { enabled: true, image: docker.io/library/infra-lua-service:latest,         port: 4059, memLimit: 64Mi }
  r-service:           { enabled: true, image: docker.io/library/infra-r-service:latest,           port: 4060, memLimit: 512Mi }
  php-service:         { enabled: true, image: docker.io/library/infra-php-service:latest,         port: 4061, memLimit: 128Mi }
  swift-service:       { enabled: true, image: docker.io/library/infra-swift-service:latest,       port: 4063, memLimit: 512Mi }
  nim-service:         { enabled: true, image: docker.io/library/infra-nim-service:latest,         port: 4064, memLimit: 128Mi }
  odin-service:        { enabled: true, image: docker.io/library/infra-odin-service:latest,        port: 4065, memLimit: 64Mi }
  haskell-service:     { enabled: true, image: docker.io/library/infra-haskell-service:latest,     port: 4065, memLimit: 128Mi }

  # ── App services (point at the in-cluster databases) ────────
  # Secret-sourced vars come first (envSecret) so composite values interpolate
  # them via $(VAR). k8s Service names match the Compose hostnames, so URLs are
  # unchanged from infra/docker-compose.services.yml.
  api-gateway:
    enabled: true
    image: docker.io/library/infra-api-gateway:latest
    port: 4000
    healthPath: /health
    healthDelay: 25
    memLimit: 320Mi
    envSecret:
      - { name: JWT_PUBLIC_KEY, key: JWT_PUBLIC_KEY }
      - { name: INTERNAL_SERVICE_TOKEN, key: INTERNAL_SERVICE_TOKEN }
      - { name: FRONTEND_URL, key: FRONTEND_URL }
      - { name: CORS_ORIGINS, key: CORS_ORIGINS }
      - { name: POLYGLOT_MESH_ENABLED, key: POLYGLOT_MESH_ENABLED }
      - { name: POLYGLOT_MESH_MAX_CONCURRENCY, key: POLYGLOT_MESH_MAX_CONCURRENCY }
      - { name: REDIS_PASSWORD, key: REDIS_PASSWORD }
    env:
      - { name: PORT, value: "4000" }
      - { name: NODE_ENV, value: production }
      - { name: REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@redis:6379" }
      - { name: AUTH_SERVICE_URL, value: "http://auth-service:4001" }
      - { name: LISTING_SERVICE_URL, value: "http://listing-service:4002" }
      - { name: SEARCH_SERVICE_URL, value: "http://search-service:4003" }
      - { name: IMAGE_SERVICE_URL, value: "http://image-service:4004" }
      - { name: NOTIFICATION_SERVICE_URL, value: "http://notification-service:4005" }
      - { name: PAYMENT_SERVICE_URL, value: "http://payment-service:4006" }
      - { name: PROFILE_SERVICE_URL, value: "http://profile-service:4007" }
      - { name: FEED_SERVICE_URL, value: "http://feed-service:4008" }
      - { name: REVIEW_SERVICE_URL, value: "http://review-service:4009" }
      - { name: ANALYTICS_SERVICE_URL, value: "http://analytics-service:4010" }
      - { name: CHAT_SERVICE_URL, value: "http://chat-service:4011" }
      - { name: ML_SERVICE_URL, value: "http://ml-service:4012" }
      - { name: CONTRACT_VALIDATOR_URL, value: "http://contract-validator:4035" }
      - { name: BRAINFUCK_SERVICE_URL, value: "http://brainfuck-service:4020" }
      - { name: ASSEMBLY_SERVICE_URL, value: "http://assembly-service:4021" }
      - { name: COBOL_SERVICE_URL, value: "http://cobol-service:4022" }
      - { name: CLOJURE_SERVICE_URL, value: "http://clojure-service:4023" }
      - { name: JULIA_SERVICE_URL, value: "http://julia-service:4054" }
      - { name: PROLOG_SERVICE_URL, value: "http://prolog-service:4055" }
      - { name: ELIXIR_SERVICE_URL, value: "http://elixir-service:4057" }
      - { name: LUA_SERVICE_URL, value: "http://lua-service:4059" }
      - { name: R_SERVICE_URL, value: "http://r-service:4060" }
      - { name: PHP_SERVICE_URL, value: "http://php-service:4061" }
      - { name: ZIG_SERVICE_URL, value: "http://zig-service:4062" }
      - { name: SWIFT_SERVICE_URL, value: "http://swift-service:4063" }
      - { name: NIM_SERVICE_URL, value: "http://nim-service:4064" }
      - { name: ODIN_SERVICE_URL, value: "http://odin-service:4065" }
      - { name: SCALA_SERVICE_URL, value: "http://scala-service:4058" }
      - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318" }
      - { name: OTEL_SERVICE_NAME, value: api-gateway }
  auth-service:
    enabled: true
    image: docker.io/library/infra-auth-service:latest
    port: 4001
    healthPath: /health/ready
    healthDelay: 25
    memLimit: 320Mi
    envSecret:
      - { name: POSTGRES_PASSWORD, key: POSTGRES_PASSWORD }
      - { name: REDIS_PASSWORD, key: REDIS_PASSWORD }
      - { name: JWT_PRIVATE_KEY, key: JWT_PRIVATE_KEY }
      - { name: JWT_PUBLIC_KEY, key: JWT_PUBLIC_KEY }
      - { name: FRONTEND_URL, key: FRONTEND_URL }
      - { name: SECRET_KEY_BASE, key: SECRET_KEY_BASE }
    env:
      - { name: PORT, value: "4001" }
      - { name: DATABASE_URL, value: "postgresql://polymarket:$(POSTGRES_PASSWORD)@postgres:5432/polymarket_auth" }
      - { name: REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@redis:6379" }
      - { name: KAFKA_BROKERS, value: "kafka:29092" }
      - { name: MIX_ENV, value: prod }
  listing-service:
    enabled: true
    image: docker.io/library/infra-listing-service:latest
    port: 4002
    healthPath: /health
    memLimit: 320Mi
    envSecret:
      - { name: MONGO_PASSWORD, key: MONGO_PASSWORD }
      - { name: REDIS_PASSWORD, key: REDIS_PASSWORD }
      - { name: JWT_PUBLIC_KEY, key: JWT_PUBLIC_KEY }
      - { name: INTERNAL_SERVICE_TOKEN, key: INTERNAL_SERVICE_TOKEN }
      - { name: CORS_ORIGINS, key: CORS_ORIGINS }
      - { name: IMAGE_PUBLIC_PATH_PREFIX, key: IMAGE_PUBLIC_PATH_PREFIX }
    env:
      - { name: PORT, value: "4002" }
      - { name: MONGO_URI, value: "mongodb://polymarket:$(MONGO_PASSWORD)@mongo:27017/polymarket?authSource=admin" }
      - { name: MONGO_DB, value: polymarket }
      - { name: REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@redis:6379" }
      - { name: KAFKA_BROKERS, value: "kafka:29092" }
      - { name: RUST_LOG, value: info }
  search-service:
    enabled: true
    image: docker.io/library/infra-search-service:latest
    port: 4003
    healthPath: /api/search/health
    healthDelay: 45
    memLimit: 720Mi
    envSecret:
      - { name: OPENSEARCH_INITIAL_ADMIN_PASSWORD, key: OPENSEARCH_INITIAL_ADMIN_PASSWORD }
    env:
      - { name: PORT, value: "4003" }
      - { name: SPRING_PROFILES_ACTIVE, value: prod }
      - { name: OPENSEARCH_URI, value: "https://opensearch:9200" }
      - { name: OPENSEARCH_USERNAME, value: admin }
      - { name: OPENSEARCH_PASSWORD, value: "$(OPENSEARCH_INITIAL_ADMIN_PASSWORD)" }
      - { name: OPENSEARCH_SSL_TRUST_ALL, value: "true" }
      - { name: SPRING_KAFKA_BOOTSTRAP_SERVERS, value: "kafka:29092" }
      - { name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE, value: "health,info,prometheus" }
  image-service:
    enabled: true
    image: docker.io/library/infra-image-service:latest
    port: 4004
    healthPath: /health
    memLimit: 400Mi
    envSecret:
      - { name: MINIO_ACCESS_KEY, key: MINIO_ROOT_USER }
      - { name: MINIO_SECRET_KEY, key: MINIO_ROOT_PASSWORD }
      - { name: INTERNAL_SERVICE_TOKEN, key: INTERNAL_SERVICE_TOKEN }
      - { name: IMAGE_PUBLIC_PATH_PREFIX, key: IMAGE_PUBLIC_PATH_PREFIX }
    env:
      - { name: HTTP_PORT, value: "4004" }
      - { name: MINIO_ENDPOINT, value: "minio:9000" }
      - { name: MINIO_BUCKET_IMAGES, value: listings-images }
      - { name: MINIO_BUCKET_AVATARS, value: avatars }
      - { name: KAFKA_BROKERS, value: "kafka:29092" }
      - { name: MAX_UPLOAD_SIZE_MB, value: "10" }
  notification-service:
    enabled: true
    image: docker.io/library/infra-notification-service:latest
    port: 4005
    healthPath: /health
    healthDelay: 25
    memLimit: 320Mi
    envSecret:
      - { name: REDIS_PASSWORD, key: REDIS_PASSWORD }
      - { name: SECRET_KEY_BASE, key: NOTIFICATION_SECRET_KEY_BASE }
      - { name: JWT_PUBLIC_KEY, key: JWT_PUBLIC_KEY }
    env:
      - { name: PORT, value: "4005" }
      - { name: REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@redis:6379" }
      - { name: KAFKA_BROKERS, value: "kafka:29092" }
      - { name: MIX_ENV, value: prod }
  payment-service:
    enabled: true
    image: docker.io/library/infra-payment-service:latest
    port: 4006
    memLimit: 320Mi
    envSecret:
      - { name: POSTGRES_PASSWORD, key: POSTGRES_PASSWORD }
      - { name: Stripe__SecretKey, key: STRIPE_SECRET_KEY }
      - { name: Stripe__WebhookSecret, key: STRIPE_WEBHOOK_SECRET }
      - { name: INTERNAL_SERVICE_TOKEN, key: INTERNAL_SERVICE_TOKEN }
    env:
      - { name: ASPNETCORE_ENVIRONMENT, value: Development }
      - { name: ASPNETCORE_URLS, value: "http://+:4006" }
      - { name: PORT, value: "4006" }
      - { name: DATABASE_URL, value: "Host=postgres;Database=polymarket_payments;Username=polymarket;Password=$(POSTGRES_PASSWORD)" }
      - { name: Kafka__BootstrapServers, value: "kafka:29092" }
  profile-service:
    enabled: true
    image: docker.io/library/infra-profile-service:latest
    port: 4007
    memLimit: 600Mi
    envSecret:
      - { name: POSTGRES_PASSWORD, key: POSTGRES_PASSWORD }
      - { name: JWT_PUBLIC_KEY, key: JWT_PUBLIC_KEY }
      - { name: FRONTEND_URL, key: FRONTEND_URL }
      - { name: CORS_ORIGINS, key: CORS_ORIGINS }
    env:
      - { name: PORT, value: "4007" }
      - { name: PROFILE_DATABASE_URL, value: "jdbc:postgresql://postgres:5432/polymarket_profiles" }
      - { name: POSTGRES_USER, value: polymarket }
      - { name: IMAGE_SERVICE_URL, value: "http://image-service:4004" }
  feed-service:
    enabled: true
    image: docker.io/library/infra-feed-service:latest
    port: 4008
    memLimit: 200Mi
    envSecret:
      - { name: SURREALDB_PASS, key: SURREALDB_PASSWORD }
      - { name: REDIS_PASSWORD, key: REDIS_PASSWORD }
      - { name: INTERNAL_SERVICE_TOKEN, key: INTERNAL_SERVICE_TOKEN }
    env:
      - { name: PORT, value: "4008" }
      - { name: SURREALDB_URL, value: "ws://surrealdb:8000/rpc" }
      - { name: SURREALDB_USER, value: polymarket }
      - { name: SURREALDB_NS, value: polymarket }
      - { name: SURREALDB_DB, value: feed }
      - { name: REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@redis:6379" }
      - { name: KAFKA_BROKERS, value: "kafka:29092" }
  review-service:
    enabled: true
    image: docker.io/library/infra-review-service:latest
    port: 4009
    healthPath: /api/health
    healthDelay: 20
    memLimit: 320Mi
    envSecret:
      - { name: APP_KEY, key: REVIEW_APP_KEY }
      - { name: DB_PASSWORD, key: MYSQL_PASSWORD }
      - { name: INTERNAL_SERVICE_TOKEN, key: INTERNAL_SERVICE_TOKEN }
    env:
      - { name: APP_ENV, value: local }
      - { name: DB_CONNECTION, value: mysql }
      - { name: DB_HOST, value: mysql }
      - { name: DB_PORT, value: "3306" }
      - { name: DB_DATABASE, value: polymarket_reviews }
      - { name: DB_USERNAME, value: polymarket }
      - { name: KAFKA_BROKERS, value: "kafka:29092" }
      - { name: PORT, value: "4009" }
  analytics-service:
    enabled: true
    image: docker.io/library/infra-analytics-service:latest
    port: 4010
    healthPath: /health
    memLimit: 320Mi
    envSecret:
      - { name: CLICKHOUSE_PASSWORD, key: CLICKHOUSE_PASSWORD }
    env:
      - { name: PORT, value: "4010" }
      - { name: CLICKHOUSE_HOST, value: clickhouse }
      - { name: CLICKHOUSE_PORT, value: "8123" }
      - { name: CLICKHOUSE_USER, value: polymarket }
      - { name: CLICKHOUSE_DB, value: polymarket_analytics }
