name: CI - Polyglot Mesh Docker Builds

on:
  push:
    paths:
      - 'services/assembly-service/**'
      - 'services/brainfuck-service/**'
      - 'services/chat-service/**'
      - 'services/clojure-service/**'
      - 'services/cobol-service/**'
      - 'services/elixir-service/**'
      - 'services/haskell-service/**'
      - 'services/julia-service/**'
      - 'services/lua-service/**'
      - 'services/nim-service/**'
      - 'services/notification-service/**'
      - 'services/php-service/**'
      - 'services/prolog-service/**'
      - 'services/r-service/**'
      - 'services/scala-service/**'
      - 'services/swift-service/**'
      - 'services/zig-service/**'
      - 'infra/docker-compose.services.yml'
      - '.github/workflows/ci-polyglot-mesh.yml'
  pull_request:
    paths:
      - 'services/assembly-service/**'
      - 'services/brainfuck-service/**'
      - 'services/chat-service/**'
      - 'services/clojure-service/**'
      - 'services/cobol-service/**'
      - 'services/elixir-service/**'
      - 'services/haskell-service/**'
      - 'services/julia-service/**'
      - 'services/lua-service/**'
      - 'services/nim-service/**'
      - 'services/notification-service/**'
      - 'services/php-service/**'
      - 'services/prolog-service/**'
      - 'services/r-service/**'
      - 'services/scala-service/**'
      - 'services/swift-service/**'
      - 'services/zig-service/**'
      - 'infra/docker-compose.services.yml'
      - '.github/workflows/ci-polyglot-mesh.yml'

jobs:
  matrix-coverage:
    name: Matrix coverage guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Matrix must match compose services
        env:
          POLYGLOT_MESH_SERVICES: |
            assembly-service
            brainfuck-service
            chat-service
            clojure-service
            cobol-service
            elixir-service
            haskell-service
            julia-service
            lua-service
            nim-service
            notification-service
            php-service
            prolog-service
            r-service
            scala-service
            swift-service
            zig-service
        run: |
          ruby <<'RUBY'
          require 'yaml'

          compose = YAML.load_file('infra/docker-compose.services.yml', aliases: true)
          workflow = YAML.load_file('.github/workflows/ci-polyglot-mesh.yml')
          compose_services = compose.fetch('services').keys
          expected = ENV.fetch('POLYGLOT_MESH_SERVICES').lines.map(&:strip).reject(&:empty?)
          matrix_services = workflow
            .fetch('jobs')
            .fetch('docker-build')
            .fetch('strategy')
            .fetch('matrix')
            .fetch('service')

          missing_from_compose = expected - compose_services
          missing_dockerfiles = expected.reject do |service|
            File.file?(File.join('services', service, 'Dockerfile'))
          end
          matrix_drift = expected.sort == matrix_services.sort ? [] : matrix_services

          unless missing_from_compose.empty? && missing_dockerfiles.empty? && matrix_drift.empty?
            puts "missing from compose: #{missing_from_compose.inspect}"
            puts "missing Dockerfiles: #{missing_dockerfiles.inspect}"
            puts "matrix services must equal POLYGLOT_MESH_SERVICES: #{matrix_drift.inspect}"
            exit 1
          end
          RUBY

  docker-build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: matrix-coverage
    strategy:
      fail-fast: false
      matrix:
        service:
          - assembly-service
          - brainfuck-service
          - chat-service
          - clojure-service
          - cobol-service
          - elixir-service
          - haskell-service
          - julia-service
          - lua-service
          - nim-service
          - notification-service
          - php-service
          - prolog-service
          - r-service
          - scala-service
          - swift-service
          - zig-service
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t polymarket/${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}/
