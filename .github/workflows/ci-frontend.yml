name: CI — Frontend (Next.js + TypeScript)

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  build-test:
    name: Lint, Type-check, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install
        run: cd frontend && npm ci

      - name: ESLint
        run: cd frontend && npm run lint

      - name: Frontend CI must fail on lint errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          source = Path('.github/workflows/ci-frontend.yml').read_text(
              encoding='utf-8'
          )
          lint_step = re.search(
              r'- name: ESLint\s+run: (?P<command>.+)',
              source,
          )
          if not lint_step:
              print('ESLint step not found')
              sys.exit(1)
          if '|| true' in lint_step.group('command'):
              print('Frontend ESLint step must not hide failures with || true')
              sys.exit(1)
          PY

      - name: TypeScript check
        run: cd frontend && npm run typecheck

      - name: Frontend public env must match production edge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          workflow = Path('.github/workflows/ci-frontend.yml').read_text(
              encoding='utf-8'
          )
          compose = Path('infra/docker-compose.services.yml').read_text(
              encoding='utf-8'
          )
          env_example = Path('.env.example').read_text(encoding='utf-8')

          errors = []
          stale_localhost_api = 'NEXT_PUBLIC_API_URL: http://localhost' + ':4000'
          if 'NEXT_PUBLIC_API_URL: ""' not in workflow:
              errors.append('frontend CI build must use same-origin API URL')
          if stale_localhost_api in workflow:
              errors.append('frontend CI must not build against localhost:4000')
          for marker in [
              'NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}',
              'NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://polyglot.micutu.com}',
              'NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://polyglot.micutu.com}',
          ]:
              if marker not in compose:
                  errors.append(f'missing compose frontend env marker: {marker}')
          for marker in [
              'NEXT_PUBLIC_API_URL=',
              'NEXT_PUBLIC_WS_URL=wss://polyglot.micutu.com',
              'NEXT_PUBLIC_APP_URL=https://polyglot.micutu.com',
          ]:
              if marker not in env_example:
                  errors.append(f'missing .env.example frontend marker: {marker}')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          PY

      - name: Unit tests (Vitest)
        run: cd frontend && npm test

      - name: Next.js build
        env:
          NEXT_PUBLIC_API_URL: ""
          NEXT_PUBLIC_WS_URL: wss://polyglot.micutu.com
          NEXT_PUBLIC_APP_URL: https://polyglot.micutu.com
          NEXT_PUBLIC_STRIPE_PK: pk_test_placeholder
        run: cd frontend && npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: cd frontend && npm ci
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: cd frontend && npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
