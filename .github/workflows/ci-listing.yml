name: CI — Listing Service (Rust)

on:
  push:
    paths:
      - 'services/listing-service/**'
      - '.github/workflows/ci-listing.yml'
  pull_request:
    paths:
      - 'services/listing-service/**'

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: polymarket
          MONGO_INITDB_ROOT_PASSWORD: test
        ports: ['27017:27017']

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libcurl4-openssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/listing-service

      - name: Check formatting
        run: cd services/listing-service && cargo fmt -- --check

      - name: Clippy (lint)
        run: cd services/listing-service && cargo clippy -- -D warnings

      - name: Run tests
        env:
          MONGODB_URI: mongodb://polymarket:test@localhost:27017/polymarket_test?authSource=admin
          REDIS_URL: redis://localhost:6379
          KAFKA_BROKERS: localhost:9092
        run: cd services/listing-service && cargo test

      - name: Build release binary (dry run)
        run: cd services/listing-service && cargo build --release

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: docker build -t polymarket/listing-service:${{ github.sha }} services/listing-service/

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit dependencies
        continue-on-error: true
        run: cd services/listing-service && cargo audit
