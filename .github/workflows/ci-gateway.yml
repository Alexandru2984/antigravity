name: CI — Gateway (Node.js / NestJS)

on:
  push:
    paths:
      - 'services/api-gateway/**'
      - '.github/workflows/ci-gateway.yml'
  pull_request:
    paths:
      - 'services/api-gateway/**'

jobs:
  test:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/api-gateway/package-lock.json'
      - name: Install
        run: cd services/api-gateway && npm ci
      - name: Lint
        run: cd services/api-gateway && npm run lint
      - name: Type-check
        run: cd services/api-gateway && npm run typecheck
      - name: Gateway must not trust client user headers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          main = Path('services/api-gateway/src/main.ts').read_text(
              encoding='utf-8'
          )
          app_module = Path(
              'services/api-gateway/src/app.module.ts'
          ).read_text(encoding='utf-8')
          proxy_controller = Path(
              'services/api-gateway/src/proxy/proxy.controller.ts'
          ).read_text(encoding='utf-8')
          compute_controller = Path(
              'services/api-gateway/src/compute.controller.ts'
          ).read_text(encoding='utf-8')
          auth_guard = Path(
              'services/api-gateway/src/auth/auth.guard.ts'
          ).read_text(encoding='utf-8')

          forbidden_cors_headers = [
              'X-User-Id',
              'X-User-Email',
              'X-User-Roles',
          ]
          leaked = [
              header for header in forbidden_cors_headers
              if re.search(rf"['\"]{re.escape(header)}['\"]", main)
          ]
          if leaked:
              print('CORS must not allow client user context headers:', leaked)
              sys.exit(1)

          forbidden_assignments = [
              "request.headers['x-user-id']",
              "request.headers['x-user-email']",
              "request.headers['x-user-roles']",
          ]
          mutated = [
              assignment for assignment in forbidden_assignments
              if assignment in auth_guard
          ]
          if mutated:
              print('AuthGuard must store identity on request.user only:', mutated)
              sys.exit(1)

          if 'bodyLimit: gatewayBodyLimitBytes()' not in main:
              print('Gateway Fastify adapter must set an explicit bodyLimit')
              sys.exit(1)

          stale_service_ports = [
              'http://notification-service:4025',
          ]
          stale_matches = [
              port for port in stale_service_ports if port in proxy_controller
          ]
          if stale_matches:
              print('Gateway proxy has stale service ports:', stale_matches)
              sys.exit(1)

          required_rate_limit_markers = {
              'ThrottlerModule.forRoot(throttlerOptions())': app_module,
              'useClass: ThrottlerGuard': app_module,
              '@Throttle({ default: AUTH_RATE_LIMIT })': proxy_controller,
              '@Throttle({ default: UPLOAD_RATE_LIMIT })': proxy_controller,
              '@Throttle({ default: POLYGLOT_TRANSACTION_RATE_LIMIT })': compute_controller,
          }
          missing_rate_limits = [
              marker
              for marker, source in required_rate_limit_markers.items()
              if marker not in source
          ]
          if missing_rate_limits:
              print('Gateway rate limit guardrails missing:', missing_rate_limits)
              sys.exit(1)
          PY
      - name: Test
        run: cd services/api-gateway && npm test -- --coverage
      - name: Audit
        continue-on-error: true
        run: cd services/api-gateway && npm audit --audit-level=high

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t polymarket/api-gateway:${{ github.sha }} services/api-gateway/
