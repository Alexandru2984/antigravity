name: CI — Feed Service (Go)

on:
  push:
    paths:
      - 'services/feed-service/**'
      - '.github/workflows/ci-feed.yml'
  pull_request:
    paths:
      - 'services/feed-service/**'

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/feed-service/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: services/feed-service
          version: latest
      - name: Test
        run: cd services/feed-service && go test ./... -race -coverprofile=coverage.out
      - name: Build
        run: cd services/feed-service && go build -o /tmp/feed-service-ci ./cmd/main.go

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t polymarket/feed-service:${{ github.sha }} services/feed-service/
