name: CI — Search Service (Java / Spring Boot)

on:
  push:
    paths:
      - 'services/search-service/**'
      - '.github/workflows/ci-search.yml'
  pull_request:
    paths:
      - 'services/search-service/**'

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Checkstyle (lint)
        run: cd services/search-service && mvn checkstyle:check -q

      - name: Build + test (Testcontainers boots OpenSearch)
        run: cd services/search-service && mvn test -Dspring.profiles.active=test

      - name: Package
        run: cd services/search-service && mvn package -DskipTests

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: cd services/search-service && mvn package -DskipTests
      - name: Build Docker
        run: docker build -t polymarket/search-service:${{ github.sha }} services/search-service/
