name: CI — Search Service (Java / Spring Boot)

on:
  push:
    paths:
      - 'services/search-service/**'
      - '.github/workflows/ci-search.yml'
  pull_request:
    paths:
      - 'services/search-service/**'

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Search CI must not skip tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          offenders = []
          forbidden = (
              '-D' + 'skipTests',
              '-D' + 'maven.test.skip=true',
          )
          for path in (Path('.github/workflows/ci-search.yml'), Path('services/search-service/Dockerfile')):
              source = path.read_text()
              for token in forbidden:
                  if token in source:
                      offenders.append(f'{path}: {token}')

          if offenders:
              raise SystemExit('Search service build must not skip tests:\n' + '\n'.join(offenders))
          PY

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build + unit test
        run: cd services/search-service && mvn test -Dspring.profiles.active=test

      - name: Package
        run: cd services/search-service && mvn package -Dspring.profiles.active=test

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: cd services/search-service && mvn package -Dspring.profiles.active=test
      - name: Build Docker
        run: docker build -t polymarket/search-service:${{ github.sha }} services/search-service/
