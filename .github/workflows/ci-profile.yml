name: CI — Profile Service (Kotlin / Ktor)

on:
  push:
    paths:
      - 'services/profile-service/**'
      - '.github/workflows/ci-profile.yml'
  pull_request:
    paths:
      - 'services/profile-service/**'

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: polymarket
          POSTGRES_PASSWORD: test
          POSTGRES_DB: polymarket_profiles_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: CORS wildcard guard
        run: "! grep -R \"anyHost()\" services/profile-service/src/main/kotlin"

      - name: Packaging must run tests first
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path(".github/workflows/ci-profile.yml").read_text()
          dockerfile = Path("services/profile-service/Dockerfile").read_text()
          build_file = Path("services/profile-service/build.gradle.kts").read_text()

          fat_jar_only = r"gradle\s+" + "buildFatJar" + r"\b"
          tested_fat_jar = r"gradle\s+test\s+" + "buildFatJar" + r"\b"

          offenders = []
          if re.search(fat_jar_only, workflow) and not re.search(tested_fat_jar, workflow):
              offenders.append("ci-profile.yml must run tests before fat jar packaging")
          if re.search(fat_jar_only, dockerfile) and not re.search(tested_fat_jar, dockerfile):
              offenders.append("profile-service Dockerfile must run tests before fat jar packaging")
          build_fat_jar_depends_on_test = re.search(
              r'tasks\.named\("buildFatJar"\)\s*\{[^}]*dependsOn\(tasks\.named\("test"\)\)',
              build_file,
              re.DOTALL,
          )
          shadow_jar_depends_on_test = re.search(
              r'tasks\.named\("shadowJar"\)\s*\{[^}]*dependsOn\(tasks\.named\("test"\)\)',
              build_file,
              re.DOTALL,
          )
          if not build_fat_jar_depends_on_test or not shadow_jar_depends_on_test:
              offenders.append("profile-service Gradle packaging tasks must depend on tests")

          if offenders:
              raise SystemExit("\n".join(offenders))
          PY

      - name: Build
        run: cd services/profile-service && gradle assemble

      - name: Test
        env:
          PROFILE_DATABASE_URL: jdbc:postgresql://localhost:5432/polymarket_profiles_test
          POSTGRES_USER: polymarket
          POSTGRES_PASSWORD: test
        run: cd services/profile-service && gradle test

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'
      - name: Build jar
        run: cd services/profile-service && gradle test buildFatJar
      - name: Build Docker
        run: docker build -t polymarket/profile-service:${{ github.sha }} services/profile-service/
