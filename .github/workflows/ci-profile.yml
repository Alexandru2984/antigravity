name: CI — Profile Service (Kotlin / Ktor)

on:
  push:
    paths:
      - 'services/profile-service/**'
      - '.github/workflows/ci-profile.yml'
  pull_request:
    paths:
      - 'services/profile-service/**'

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: polymarket
          POSTGRES_PASSWORD: test
          POSTGRES_DB: polymarket_profiles_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: CORS wildcard guard
        run: "! grep -R \"anyHost()\" services/profile-service/src/main/kotlin"

      - name: Build
        run: cd services/profile-service && gradle assemble

      - name: Test
        env:
          PROFILE_DATABASE_URL: jdbc:postgresql://localhost:5432/polymarket_profiles_test
          POSTGRES_USER: polymarket
          POSTGRES_PASSWORD: test
        run: cd services/profile-service && gradle test

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'
      - name: Build jar
        run: cd services/profile-service && gradle buildFatJar
      - name: Build Docker
        run: docker build -t polymarket/profile-service:${{ github.sha }} services/profile-service/
