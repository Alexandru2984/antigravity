name: CI — Auth Service (Elixir)

on:
  push:
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/ci-auth.yml'
  pull_request:
    paths:
      - 'services/auth-service/**'

env:
  MIX_ENV: test
  ELIXIR_VERSION: '1.16'
  OTP_VERSION: '26'

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: polymarket
          POSTGRES_PASSWORD: polymarket_test
          POSTGRES_DB: polymarket_auth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: services/auth-service/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('services/auth-service/mix.lock') }}

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: services/auth-service/_build
          key: ${{ runner.os }}-build-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('services/auth-service/mix.lock') }}

      - name: Install deps
        run: cd services/auth-service && mix deps.get

      - name: Generate test JWT keys
        run: |
          openssl genrsa -out /tmp/auth-service-jwt-private.pem 2048
          openssl rsa -in /tmp/auth-service-jwt-private.pem -pubout -out /tmp/auth-service-jwt-public.pem
          {
            echo 'JWT_PRIVATE_KEY<<EOF'
            cat /tmp/auth-service-jwt-private.pem
            echo 'EOF'
            echo 'JWT_PUBLIC_KEY<<EOF'
            cat /tmp/auth-service-jwt-public.pem
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Compile (warnings as errors)
        run: cd services/auth-service && mix compile --warnings-as-errors

      - name: Format check
        run: |
          cd services/auth-service
          mix format --check-formatted \
            mix.exs \
            config/config.exs \
            config/runtime.exs \
            config/test.exs \
            lib/auth_service/application.ex \
            lib/auth_service_web/endpoint.ex \
            lib/auth_service_web/router.ex \
            test/test_helper.exs \
            test/**/*.exs

      - name: CORS must use explicit headers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          offenders = []
          for path in [
              Path('services/auth-service/lib/auth_service_web/endpoint.ex'),
              Path('services/auth-service/lib/auth_service_web/router.ex'),
          ]:
              source = path.read_text(encoding='utf-8')
              if 'allow_headers: :all' in source:
                  offenders.append(f'{path}: allow_headers: :all')
              for header in ['x-user-id', 'x-user-email', 'x-user-roles']:
                  if header in source.lower():
                      offenders.append(f'{path}: exposes {header} via CORS')

          if offenders:
              print('Auth CORS must use explicit public headers only:')
              print('\n'.join(offenders))
              sys.exit(1)
          PY

      - name: JWT private key must stay runtime-only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          config = Path('services/auth-service/config/config.exs').read_text(
              encoding='utf-8'
          )
          runtime = Path('services/auth-service/config/runtime.exs').read_text(
              encoding='utf-8'
          )
          dockerignore = Path('services/auth-service/.dockerignore').read_text(
              encoding='utf-8'
          )

          errors = []
          if 'JWT_PRIVATE_KEY' in config or 'jwt_private.pem' in config:
              errors.append('config.exs must not read or embed JWT private keys')
          if 'JWT_PRIVATE_KEY' not in runtime:
              errors.append('runtime.exs must load JWT_PRIVATE_KEY at runtime')
          if 'config_env() == :prod' not in runtime or 'environment variable JWT_PRIVATE_KEY is missing' not in runtime:
              errors.append('runtime.exs must require JWT_PRIVATE_KEY in prod')
          if 'priv/keys/' not in dockerignore:
              errors.append('.dockerignore must exclude priv/keys/')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          PY

      - name: Credo (lint)
        run: cd services/auth-service && mix credo --strict

      - name: Dialyzer (type check)
        run: cd services/auth-service && mix dialyzer --quiet

      - name: Run tests
        env:
          DATABASE_URL: postgresql://polymarket:polymarket_test@localhost:5432/polymarket_auth_test
          REDIS_URL: redis://localhost:6379
          SECRET_KEY_BASE: testingsecretkeybase64bitsmin
        run: cd services/auth-service && mix test

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t polymarket/auth-service:${{ github.sha }} services/auth-service/
