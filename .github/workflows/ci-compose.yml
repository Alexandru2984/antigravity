name: Compose Config

on:
  push:
    paths:
      - 'infra/docker-compose*.yml'
      - 'scripts/deploy.sh'
      - 'scripts/health-check.sh'
      - 'Makefile'
      - 'README.md'
      - 'frontend/Dockerfile'
      - 'services/*/Dockerfile'
      - '.github/workflows/ci-compose.yml'
  pull_request:
    paths:
      - 'infra/docker-compose*.yml'
      - 'scripts/deploy.sh'
      - 'scripts/health-check.sh'
      - 'Makefile'
      - 'README.md'
      - 'frontend/Dockerfile'
      - 'services/*/Dockerfile'
      - '.github/workflows/ci-compose.yml'

jobs:
  compose-config:
    runs-on: ubuntu-latest
    env:
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: dummy-opensearch-password-1234567890
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      STRIPE_PUBLISHABLE_KEY: pk_test_dummy
      POSTGRES_PASSWORD: dummy-postgres-password-1234567890
      MONGO_PASSWORD: dummy-mongo-password-1234567890
      MYSQL_ROOT_PASSWORD: dummy-mysql-root-password-1234567890
      MYSQL_PASSWORD: dummy-mysql-password-1234567890
      REDIS_PASSWORD: dummy-redis-password-1234567890
      CLICKHOUSE_PASSWORD: dummy-clickhouse-password-1234567890
      TIMESCALE_PASSWORD: dummy-timescale-password-1234567890
      SURREALDB_PASSWORD: dummy-surreal-password-1234567890
      MINIO_ROOT_USER: dummy-minio-admin
      MINIO_ROOT_PASSWORD: dummy-minio-password-1234567890
      NEO4J_PASSWORD: dummy-neo4j-password-1234567890
      SECRET_KEY_BASE: dummy-secret-key-base-1234567890
      NOTIFICATION_SECRET_KEY_BASE: dummy-notification-secret-key-base-1234567890
      CHAT_SECRET_KEY_BASE: dummy-chat-secret-key-base-1234567890
      ADMIN_SECRET_KEY_BASE: dummy-admin-secret-key-base-1234567890
      REVIEW_APP_KEY: base64:dummyreviewappkey
      GRAFANA_ADMIN_PASSWORD: dummy-grafana-password-1234567890
      JWT_PUBLIC_KEY: dummy-public-key
      JWT_PRIVATE_KEY: dummy-private-key
      INTERNAL_SERVICE_TOKEN: dummy-internal-token
      FRONTEND_URL: https://polyglot.micutu.com
      CORS_ORIGINS: https://polyglot.micutu.com
      POLYGLOT_MESH_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Root compose must stay removed
        run: test ! -e docker-compose.yml

      - name: DB init must fail fast
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          makefile = Path('Makefile').read_text(encoding='utf-8')
          match = re.search(r'^db-init:.*?(?=^\S)', makefile, re.M | re.S)
          if not match:
              print('db-init target not found')
              sys.exit(1)

          target = match.group(0)
          if 'ON_ERROR_STOP=1' not in target:
              print('db-init must run psql with ON_ERROR_STOP=1')
              sys.exit(1)
          if '2>/dev/null' in target or '|| true' in target:
              print('db-init must not hide init script failures')
              sys.exit(1)
          PY

      - name: Compose YAML must not contain duplicate keys
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import yaml
          from yaml.nodes import MappingNode, SequenceNode

          errors = []

          def walk(node, path, source):
              if isinstance(node, MappingNode):
                  seen = {}
                  for key_node, value_node in node.value:
                      key = key_node.value
                      location = f'{source}:{key_node.start_mark.line + 1}'
                      if key in seen:
                          errors.append(
                              f'{location}: duplicate key {key!r}; first seen at {seen[key]}'
                          )
                      else:
                          seen[key] = location
                      walk(value_node, f'{path}.{key}', source)
              elif isinstance(node, SequenceNode):
                  for index, item in enumerate(node.value):
                      walk(item, f'{path}[{index}]', source)

          for compose_file in sorted(Path('infra').glob('docker-compose*.yml')):
              root = yaml.compose(compose_file.read_text(encoding='utf-8'))
              if root is not None:
                  walk(root, '$', str(compose_file))

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          PY

      - name: Polyglot mesh transaction must require auth
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          source = Path('services/api-gateway/src/compute.controller.ts').read_text(
              encoding='utf-8'
          )
          class_match = re.search(
              r'@Controller\\(\\'api/v1/polyglot-mesh\\'\\)\\s*export class ComputeController',
              source,
          )
          if not class_match:
              print('ComputeController route declaration not found')
              sys.exit(1)

          before_class = source[:class_match.start()]
          previous_decorator_block = before_class.split('\\n\\n')[-1]
          if '@Public()' in previous_decorator_block:
              print('ComputeController class must not be public')
              sys.exit(1)

          transaction_match = re.search(
              r'@Post\\(\\'transaction\\'\\)\\s*async executeTransaction',
              source,
          )
          if not transaction_match:
              print('executeTransaction route not found')
              sys.exit(1)

          before_transaction = source[:transaction_match.start()]
          previous_method_block = before_transaction.split('\\n\\n')[-1]
          if '@Public()' in previous_method_block:
              print('polyglot mesh transaction must not be public')
              sys.exit(1)
          PY

      - name: Validate canonical compose stack
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.services.yml config >/tmp/compose-config.yml

      - name: Validate observability compose stack
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.obs.yml config >/tmp/obs-compose-config.yml

      - name: Compose images must be pinned
        run: |
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.services.yml config --format json >/tmp/compose-config.json
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.obs.yml config --format json >/tmp/obs-compose-config.json
          python3 - <<'PY'
          import json
          import sys

          services = {}
          for path in ['/tmp/compose-config.json', '/tmp/obs-compose-config.json']:
              with open(path, encoding='utf-8') as handle:
                  services.update(json.load(handle)['services'])

          offenders = {}
          for name, service in services.items():
              image = service.get('image')
              if not image:
                  continue
              repository = image.rsplit('/', 1)[-1].split('@', 1)[0]
              tag = repository.rsplit(':', 1)[1] if ':' in repository else ''
              if not tag or tag == 'latest' or tag.startswith('latest-'):
                  offenders[name] = image

          if offenders:
              print('Compose images must use pinned non-latest tags:', offenders)
              sys.exit(1)
          PY

      - name: Only nginx publishes host ports
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open('/tmp/compose-config.json', encoding='utf-8') as handle:
              services = json.load(handle)['services']
          with open('/tmp/obs-compose-config.json', encoding='utf-8') as handle:
              obs_services = json.load(handle)['services']

          offenders = {
              name: service.get('ports')
              for name, service in services.items()
              if service.get('ports') and name != 'nginx'
          }
          offenders.update({
              name: service.get('ports')
              for name, service in obs_services.items()
              if service.get('ports')
          })
          if offenders:
              print('Only nginx may publish host ports:', offenders)
              sys.exit(1)

          nginx_ports = {
              (str(port.get('published')), int(port.get('target')))
              for port in services.get('nginx', {}).get('ports', [])
          }
          expected = {('80', 80), ('443', 443)}
          if nginx_ports != expected:
              print(f'nginx must publish only 80/443, got: {nginx_ports}')
              sys.exit(1)
          PY

      - name: Compose services must have hardening and memory limits
        run: |
          python3 - <<'PY'
          import json
          import sys

          configs = []
          for path in ['/tmp/compose-config.json', '/tmp/obs-compose-config.json']:
              with open(path, encoding='utf-8') as handle:
                  configs.append(json.load(handle)['services'])

          services = {}
          for config in configs:
              services.update(config)

          missing_no_new_privileges = []
          missing_mem_limit = []
          missing_cap_drop = []
          missing_read_only = []
          missing_tmpfs = []
          missing_runtime_user = []
          dependency_errors = []
          app_exceptions = {
              'nginx',
              'postgres',
              'mongo',
              'mysql',
              'redis',
              'clickhouse',
              'opensearch',
              'opensearch-dashboards',
              'timescale',
              'neo4j',
              'surrealdb',
              'zookeeper',
              'kafka',
              'kafka-ui',
              'minio',
              'otel-collector',
              'jaeger',
              'prometheus',
              'grafana',
              'loki',
              'promtail',
          }
          read_only_services = {
              'api-gateway',
              'listing-service',
              'search-service',
              'image-service',
              'payment-service',
              'profile-service',
              'feed-service',
              'analytics-service',
              'ml-service',
              'config-service',
              'contract-validator',
              'frontend',
              'brainfuck-service',
              'assembly-service',
              'cobol-service',
              'clojure-service',
              'julia-service',
              'prolog-service',
              'elixir-service',
              'scala-service',
              'lua-service',
              'odin-service',
              'r-service',
              'php-service',
              'zig-service',
              'nim-service',
              'swift-service',
              'haskell-service',
          }

          for name, service in services.items():
              if 'no-new-privileges:true' not in service.get('security_opt', []):
                  missing_no_new_privileges.append(name)
              if 'mem_limit' not in service:
                  missing_mem_limit.append(name)
              if name not in app_exceptions and 'ALL' not in service.get('cap_drop', []):
                  missing_cap_drop.append(name)
              if name in read_only_services:
                  tmpfs = service.get('tmpfs', [])
                  if service.get('read_only') is not True:
                      missing_read_only.append(name)
                  if not any(str(entry).startswith('/tmp:') for entry in tmpfs):
                      missing_tmpfs.append(name)
              build = service.get('build')
              if build:
                  dockerfile = build.get('dockerfile') or 'Dockerfile'
                  dockerfile_path = f"{build['context'].rstrip('/')}/{dockerfile}"
                  with open(dockerfile_path, encoding='utf-8') as handle:
                      lines = handle.readlines()
                  last_from = max(
                      index for index, line in enumerate(lines)
                      if line.lstrip().upper().startswith('FROM ')
                  )
                  if not any(
                      line.lstrip().upper().startswith('USER ')
                      for line in lines[last_from + 1:]
                  ):
                      missing_runtime_user.append(name)

          auth_service = services.get('auth-service', {})
          if 'healthcheck' not in auth_service:
              dependency_errors.append('auth-service must define a healthcheck')

          api_gateway = services.get('api-gateway', {})
          api_gateway_env = api_gateway.get('environment', {})
          if str(api_gateway_env.get('PORT')) != '4000':
              dependency_errors.append('api-gateway must listen on PORT 4000')

          auth_dependency = (
              api_gateway
              .get('depends_on', {})
              .get('auth-service', {})
          )
          if auth_dependency.get('condition') != 'service_healthy':
              dependency_errors.append(
                  'api-gateway must wait for auth-service service_healthy'
              )
          mesh_urls = {
              'PHP_SERVICE_URL': 'http://php-service:4061',
              'SWIFT_SERVICE_URL': 'http://swift-service:4063',
              'ODIN_SERVICE_URL': 'http://odin-service:4065',
              'SCALA_SERVICE_URL': 'http://scala-service:4058',
          }
          for env_name, expected_url in mesh_urls.items():
              if api_gateway_env.get(env_name) != expected_url:
                  dependency_errors.append(
                      f'api-gateway must set {env_name}={expected_url}'
                  )

          frontend_service = services.get('frontend', {})
          if 'healthcheck' not in frontend_service:
              dependency_errors.append('frontend must define a healthcheck')
          frontend_healthcheck = ' '.join(
              frontend_service.get('healthcheck', {}).get('test', [])
          )
          if '127.0.0.1:3000' not in frontend_healthcheck:
              dependency_errors.append(
                  'frontend healthcheck must probe localhost:3000'
              )
          frontend_dependency = (
              frontend_service
              .get('depends_on', {})
              .get('api-gateway', {})
          )
          if frontend_dependency.get('condition') != 'service_healthy':
              dependency_errors.append(
                  'frontend must wait for api-gateway service_healthy'
              )

          nginx_service = services.get('nginx', {})
          for dependency_name in ['api-gateway', 'frontend']:
              dependency = (
                  nginx_service
                  .get('depends_on', {})
                  .get(dependency_name, {})
              )
              if dependency.get('condition') != 'service_healthy':
                  dependency_errors.append(
                      f'nginx must wait for {dependency_name} service_healthy'
                  )

          chat_service = services.get('chat-service', {})
          chat_env = chat_service.get('environment', {})
          if not chat_env.get('JWT_PUBLIC_KEY'):
              dependency_errors.append('chat-service must receive JWT_PUBLIC_KEY')

          surrealdb_init = services.get('surrealdb-init', {})
          if not surrealdb_init:
              dependency_errors.append('surrealdb-init must prepare the data volume')
          if str(surrealdb_init.get('user')) != 'root':
              dependency_errors.append('surrealdb-init must run as root only for chown')
          if 'ALL' not in surrealdb_init.get('cap_drop', []):
              dependency_errors.append('surrealdb-init must drop all capabilities')
          if surrealdb_init.get('cap_add') != ['CHOWN']:
              dependency_errors.append('surrealdb-init must add only CHOWN capability')
          if surrealdb_init.get('network_mode') != 'none':
              dependency_errors.append('surrealdb-init must not join a network')

          surrealdb_service = services.get('surrealdb', {})
          surrealdb_user = str(surrealdb_service.get('user', ''))
          if surrealdb_user in {'', '0', '0:0', 'root'}:
              dependency_errors.append('surrealdb must run as a non-root user')
          surrealdb_command = surrealdb_service.get('command', [])
          if isinstance(surrealdb_command, str):
              surrealdb_command = surrealdb_command.split()
          if '--auth' not in surrealdb_command:
              dependency_errors.append('surrealdb must enable authentication')
          surrealdb_dependency = (
              surrealdb_service
              .get('depends_on', {})
              .get('surrealdb-init', {})
          )
          if surrealdb_dependency.get('condition') != 'service_completed_successfully':
              dependency_errors.append(
                  'surrealdb must wait for surrealdb-init service_completed_successfully'
              )

          mysql_service = services.get('mysql', {})
          mysql_healthcheck = ' '.join(mysql_service.get('healthcheck', {}).get('test', []))
          if 'mysqladmin ping' in mysql_healthcheck or 'SELECT 1' not in mysql_healthcheck:
              dependency_errors.append(
                  'mysql healthcheck must validate authenticated SELECT 1'
              )

          listing_service = services.get('listing-service', {})
          listing_env = listing_service.get('environment', {})
          if str(listing_env.get('PORT')) != '4002':
              dependency_errors.append('listing-service must listen on PORT 4002')

          profile_service = services.get('profile-service', {})
          profile_env = profile_service.get('environment', {})
          if str(profile_env.get('PORT')) != '4007':
              dependency_errors.append('profile-service must listen on PORT 4007')
          if 'healthcheck' not in profile_service:
              dependency_errors.append('profile-service must define a healthcheck')
          profile_healthcheck = ' '.join(profile_service.get('healthcheck', {}).get('test', []))
          if 'app.jar' not in profile_healthcheck or '--health' not in profile_healthcheck:
              dependency_errors.append(
                  'profile-service healthcheck must use app.jar --health'
              )

          feed_service = services.get('feed-service', {})
          feed_env = feed_service.get('environment', {})
          if str(feed_env.get('PORT')) != '4008':
              dependency_errors.append('feed-service must listen on PORT 4008')
          if 'healthcheck' not in feed_service:
              dependency_errors.append('feed-service must define a healthcheck')
          if not feed_env.get('INTERNAL_SERVICE_TOKEN'):
              dependency_errors.append(
                  'feed-service must receive INTERNAL_SERVICE_TOKEN'
              )

          payment_service = services.get('payment-service', {})
          payment_env = payment_service.get('environment', {})
          if str(payment_env.get('PORT')) != '4006':
              dependency_errors.append('payment-service must listen on PORT 4006')
          if 'healthcheck' not in payment_service:
              dependency_errors.append('payment-service must define a healthcheck')
          if not payment_env.get('INTERNAL_SERVICE_TOKEN'):
              dependency_errors.append(
                  'payment-service must receive INTERNAL_SERVICE_TOKEN'
              )

          review_service = services.get('review-service', {})
          review_env = review_service.get('environment', {})
          if str(review_env.get('PORT')) != '4009':
              dependency_errors.append('review-service must listen on PORT 4009')
          if 'healthcheck' not in review_service:
              dependency_errors.append('review-service must define a healthcheck')
          if not review_env.get('INTERNAL_SERVICE_TOKEN'):
              dependency_errors.append(
                  'review-service must receive INTERNAL_SERVICE_TOKEN'
              )

          search_service = services.get('search-service', {})
          search_env = search_service.get('environment', {})
          if str(search_env.get('PORT')) != '4003':
              dependency_errors.append('search-service must listen on PORT 4003')
          if search_env.get('OPENSEARCH_URI') != 'https://opensearch:9200':
              dependency_errors.append(
                  'search-service must use authenticated HTTPS OpenSearch'
              )
          if search_env.get('OPENSEARCH_USERNAME') != 'admin':
              dependency_errors.append('search-service must set OPENSEARCH_USERNAME')
          if not search_env.get('OPENSEARCH_PASSWORD'):
              dependency_errors.append('search-service must set OPENSEARCH_PASSWORD')
          if str(search_env.get('OPENSEARCH_SSL_TRUST_ALL')).lower() != 'true':
              dependency_errors.append(
                  'search-service must trust the internal OpenSearch certificate'
              )
          if 'healthcheck' not in search_service:
              dependency_errors.append('search-service must define a healthcheck')

          image_service = services.get('image-service', {})
          image_env = image_service.get('environment', {})
          if str(image_env.get('HTTP_PORT')) != '4004':
              dependency_errors.append('image-service must listen on HTTP_PORT 4004')
          if not image_env.get('INTERNAL_SERVICE_TOKEN'):
              dependency_errors.append(
                  'image-service must receive INTERNAL_SERVICE_TOKEN'
              )
          if str(image_env.get('MAX_UPLOAD_SIZE_MB')) != '10':
              dependency_errors.append('image-service must cap uploads at 10 MB')
          if image_env.get('MINIO_BUCKET_IMAGES') != 'listings-images':
              dependency_errors.append(
                  'image-service must receive the listings image bucket name'
              )
          if 'healthcheck' not in image_service:
              dependency_errors.append('image-service must define a healthcheck')
          image_healthcheck = ' '.join(image_service.get('healthcheck', {}).get('test', []))
          if '/health' not in image_healthcheck or 'HTTP_PORT' not in image_healthcheck:
              dependency_errors.append(
                  'image-service healthcheck must use HTTP_PORT /health'
              )

          if (
              missing_no_new_privileges
              or missing_mem_limit
              or missing_cap_drop
              or missing_read_only
              or missing_tmpfs
              or missing_runtime_user
              or dependency_errors
          ):
              print('missing no-new-privileges:', missing_no_new_privileges)
              print('missing mem_limit:', missing_mem_limit)
              print('missing cap_drop ALL:', missing_cap_drop)
              print('missing read_only:', missing_read_only)
              print('missing /tmp tmpfs:', missing_tmpfs)
              print('missing runtime USER:', missing_runtime_user)
              print('dependency errors:', dependency_errors)
              sys.exit(1)
          PY
