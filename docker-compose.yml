version: "3.9"

# ── Networks ──────────────────────────────────────────────────
networks:
  frontend:
  backend:
  data:

# ── Volumes ───────────────────────────────────────────────────
volumes:
  postgres_data:
  mongo_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  minio_data:
  clickhouse_data:
  neo4j_data:
  opensearch_data:

x-stateful-security: &stateful_security
  security_opt:
    - no-new-privileges:true

x-app-security: &app_security
  <<: *stateful_security
  cap_drop:
    - ALL

x-readonly-app-security: &readonly_app_security
  <<: *app_security
  read_only: true
  tmpfs:
    - /tmp:noexec,nosuid,nodev

services:

# ═══════════════════════════════════════════════════════════════
# INFRASTRUCTURE
# ═══════════════════════════════════════════════════════════════

  postgres:
    <<: *stateful_security
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     polymarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB:       polymarket
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [data]
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polymarket"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    <<: *stateful_security
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: polymarket
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    volumes:
      - mongo_data:/data/db
    networks: [data]
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  redis:
    <<: *stateful_security
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks: [data, backend]
    deploy:
      resources:
        limits:
          memory: 300M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  zookeeper:
    <<: *stateful_security
    image: confluentinc/cp-zookeeper:7.7.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper_data:/var/lib/zookeeper
    networks: [data]
    deploy:
      resources:
        limits:
          memory: 400M
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      retries: 5

  kafka:
    <<: *stateful_security
    image: confluentinc/cp-kafka:7.7.0
    restart: unless-stopped
    depends_on:
      zookeeper: {condition: service_healthy}
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [data, backend]
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      retries: 5

  opensearch:
    <<: *stateful_security
    image: opensearchproject/opensearch:2.12.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?OPENSEARCH_INITIAL_ADMIN_PASSWORD is required}
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks: [data, backend]
    deploy:
      resources:
        limits:
          memory: 1.5G
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f -u \"admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD}\" https://localhost:9200/_cluster/health"]
      interval: 20s
      retries: 10

  minio:
    <<: *stateful_security
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    networks: [data, backend]
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      retries: 5

  clickhouse:
    <<: *stateful_security
    image: clickhouse/clickhouse-server:24.11
    restart: unless-stopped
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/db/clickhouse-init.sql:/docker-entrypoint-initdb.d/clickhouse-init.sql:ro
    networks: [data]
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 15s
      retries: 5

  neo4j:
    <<: *stateful_security
    image: neo4j:5.25
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
    networks: [data]
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$NEO4J_PASSWORD\" 'RETURN 1'"]
      interval: 20s
      retries: 5

# ═══════════════════════════════════════════════════════════════
# SERVICES
# ═══════════════════════════════════════════════════════════════

  auth-service:
    <<: *app_security
    build: ./services/auth-service
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
      kafka:    {condition: service_healthy}
    environment:
      DATABASE_URL:   postgresql://polymarket:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polymarket
      REDIS_URL:      redis://redis:6379
      KAFKA_BROKERS:  kafka:9092
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      JWT_PUBLIC_KEY:  ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      PORT: 4020
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 300M

  api-gateway:
    <<: *readonly_app_security
    build: ./services/api-gateway
    restart: unless-stopped
    depends_on:
      auth-service: {condition: service_started}
      redis: {condition: service_healthy}
    environment:
      PORT:              4021
      REDIS_URL:         redis://redis:6379
      JWT_PUBLIC_KEY:    ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      FRONTEND_URL:      ${FRONTEND_URL:?FRONTEND_URL is required}
      CORS_ORIGINS:      ${CORS_ORIGINS:?CORS_ORIGINS is required}
      POLYGLOT_MESH_ENABLED: ${POLYGLOT_MESH_ENABLED:?POLYGLOT_MESH_ENABLED is required}
      POLYGLOT_MESH_MAX_CONCURRENCY: ${POLYGLOT_MESH_MAX_CONCURRENCY:-2}
      AUTH_SERVICE_URL:  http://auth-service:4020
      LISTING_SERVICE_URL: http://listing-service:4022
      SEARCH_SERVICE_URL:  http://search-service:4023
      IMAGE_SERVICE_URL:   http://image-service:4024
      PROFILE_SERVICE_URL: http://profile-service:4027
      PAYMENT_SERVICE_URL: http://payment-service:4026
      REVIEW_SERVICE_URL:  http://review-service:4009
      FEED_SERVICE_URL:    http://feed-service:4028
      CHAT_SERVICE_URL:    http://chat-service:4031
      ANALYTICS_SERVICE_URL: http://analytics-service:4030
      ML_SERVICE_URL:      http://ml-service:4028
      CONFIG_SERVICE_URL:  http://config-service:4034
      CONTRACT_VALIDATOR_URL: http://contract-validator:4035
      PROLOG_SERVICE_URL:  http://prolog-service:4055
      CLOJURE_SERVICE_URL: http://clojure-service:4023
      JULIA_SERVICE_URL:   http://julia-service:4054
      R_SERVICE_URL:       http://r-service:4060
      COBOL_SERVICE_URL:   http://cobol-service:4022
      ASSEMBLY_SERVICE_URL: http://assembly-service:4021
      ZIG_SERVICE_URL:     http://zig-service:4062
      BRAINFUCK_SERVICE_URL: http://brainfuck-service:4020
    networks: [frontend, backend]
    deploy:
      resources:
        limits:
          memory: 200M

  listing-service:
    <<: *readonly_app_security
    build: ./services/listing-service
    restart: unless-stopped
    depends_on:
      mongo:  {condition: service_healthy}
      kafka:  {condition: service_healthy}
    environment:
      MONGO_URI:      mongodb://polymarket:${MONGO_PASSWORD:?MONGO_PASSWORD is required}@mongo:27017/polymarket?authSource=admin
      KAFKA_BROKERS:  kafka:9092
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      CORS_ORIGINS:   ${CORS_ORIGINS:?CORS_ORIGINS is required}
      IMAGE_PUBLIC_PATH_PREFIX: ${IMAGE_PUBLIC_PATH_PREFIX:-/api/v1/images}
      PORT: 4022
    networks: [backend, data]
    deploy:
      resources:
        limits:
          memory: 300M

  search-service:
    <<: *app_security
    build: ./services/search-service
    restart: unless-stopped
    depends_on:
      opensearch: {condition: service_healthy}
      kafka: {condition: service_healthy}
    environment:
      OPENSEARCH_URI:  https://opensearch:9200
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?OPENSEARCH_INITIAL_ADMIN_PASSWORD is required}
      OPENSEARCH_SSL_TRUST_ALL: "true"
      KAFKA_BROKERS:   kafka:9092
      JWT_PUBLIC_KEY:  ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      PORT: 4023
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 700M

  image-service:
    <<: *readonly_app_security
    build: ./services/image-service
    restart: unless-stopped
    depends_on:
      minio: {condition: service_healthy}
      kafka:  {condition: service_healthy}
    environment:
      MINIO_ENDPOINT:   http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      IMAGE_BUCKET: listings-images
      IMAGE_PUBLIC_PATH_PREFIX: ${IMAGE_PUBLIC_PATH_PREFIX:-/api/v1/images}
      KAFKA_BROKERS:    kafka:9092
      PORT: 4024
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 400M

  profile-service:
    <<: *app_security
    build: ./services/profile-service
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL:   jdbc:postgresql://postgres:5432/polymarket
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      PORT: 4027
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 600M

  payment-service:
    <<: *app_security
    build: ./services/payment-service
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      kafka:    {condition: service_healthy}
    environment:
      DATABASE_URL:          Host=postgres;Port=5432;Database=payments;Username=polymarket;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      STRIPE_SECRET_KEY:     ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}
      KAFKA_BROKERS:         kafka:9092
      PORT: 4026
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 200M

  notification-service:
    <<: *app_security
    build: ./services/notification-service
    restart: unless-stopped
    depends_on:
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_URL:     redis://redis:6379
      PORT: 4025
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 300M

  feed-service:
    <<: *readonly_app_security
    build: ./services/feed-service
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
    environment:
      REDIS_URL: redis:6379
      PORT: 4028
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 200M

  review-service:
    <<: *app_security
    build: ./services/review-service
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB_HOST:       postgres
      DB_PORT:       5432
      DB_DATABASE:   reviews
      DB_USERNAME:   polymarket
      DB_PASSWORD:   ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      KAFKA_BROKERS: kafka:9092
      APP_KEY:       ${REVIEW_APP_KEY:?REVIEW_APP_KEY is required}
      PORT: 4029
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 250M

  analytics-service:
    <<: *app_security
    build: ./services/analytics-service
    restart: unless-stopped
    depends_on:
      clickhouse: {condition: service_healthy}
      kafka:      {condition: service_healthy}
    environment:
      KAFKA_BROKERS:      kafka:9092
      CLICKHOUSE_HOST:    clickhouse
      CLICKHOUSE_PORT:    9000
      PORT: 4030
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 300M

  chat-service:
    <<: *app_security
    build: ./services/chat-service
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL:    ecto://polymarket:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres/chat
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      FRONTEND_URL:    ${FRONTEND_URL:?FRONTEND_URL is required}
      PHX_HOST:        chat-service
      PORT: 4031
    networks: [backend, frontend]
    deploy:
      resources:
        limits:
          memory: 400M

  ml-service:
    <<: *app_security
    build: ./services/ml-service
    restart: unless-stopped
    depends_on:
      neo4j: {condition: service_healthy}
    environment:
      NEO4J_URI:      bolt://neo4j:7687
      NEO4J_USER:     neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      PORT: 4028
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 500M

  stream-processor:
    <<: *app_security
    build: ./services/stream-processor
    restart: unless-stopped
    depends_on:
      kafka:      {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    environment:
      KAFKA_BROKERS:       kafka:9092
      CLICKHOUSE_JDBC_URL: jdbc:clickhouse://clickhouse:8123/analytics
      PORT: 4033
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 600M

  config-service:
    <<: *app_security
    build: ./services/config-service
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: Host=postgres;Port=5432;Database=config;Username=polymarket;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PORT: 4034
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 200M

  contract-validator:
    <<: *readonly_app_security
    build: ./services/contract-validator
    restart: unless-stopped
    environment:
      PORT: 4035
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 500M

  admin-panel:
    <<: *app_security
    build: ./services/admin-panel
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL:    postgresql://polymarket:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polymarket
      SECRET_KEY_BASE: ${ADMIN_SECRET_KEY_BASE:?ADMIN_SECRET_KEY_BASE is required}
      RAILS_ENV:       production
      PORT: 4036
    networks: [backend, frontend]
    deploy:
      resources:
        limits:
          memory: 400M

  frontend:
    <<: *app_security
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL:    ${FRONTEND_URL:?FRONTEND_URL is required}
      NEXT_PUBLIC_WS_URL:     ws://chat-service:4031
      HOSTNAME:               "0.0.0.0"
    networks: [frontend]
    depends_on:
      api-gateway: {condition: service_started}
    deploy:
      resources:
        limits:
          memory: 300M

  nginx:
    <<: *stateful_security
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    networks: [frontend]
    depends_on:
      api-gateway: {condition: service_started}
      frontend: {condition: service_started}
    deploy:
      resources:
        limits:
          memory: 100M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      retries: 3



  brainfuck-service:
    <<: *readonly_app_security
    build: ./services/brainfuck-service
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 64M}

  assembly-service:
    <<: *readonly_app_security
    build: ./services/assembly-service
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 128M}

  cobol-service:
    <<: *readonly_app_security
    build: ./services/cobol-service
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 64M}

  clojure-service:
    <<: *app_security
    build: ./services/clojure-service
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 400M}

  julia-service:
    <<: *app_security
    build: ./services/julia-service
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 400M}

  prolog-service:
    <<: *app_security
    build: ./services/prolog-service
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 128M}

  elixir-service:
    <<: *app_security
    build: ./services/elixir-service
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 200M}

  scala-service:
    <<: *app_security
    build: ./services/scala-service
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 512M}

  lua-service:
    <<: *readonly_app_security
    build: ./services/lua-service
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 64M}

  r-service:
    <<: *app_security
    build: ./services/r-service
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 512M}

  php-service:
    <<: *readonly_app_security
    build: ./services/php-service
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 128M}

  zig-service:
    <<: *readonly_app_security
    build: ./services/zig-service
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 64M}

  nim-service:
    <<: *readonly_app_security
    build: ./services/nim-service
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 128M}

  swift-service:
    <<: *app_security
    build: ./services/swift-service
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 512M}

  haskell-service:
    <<: *readonly_app_security
    build: ./services/haskell-service
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 128M}
