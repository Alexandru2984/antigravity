version: "3.9"

# ── Networks ──────────────────────────────────────────────────
networks:
  frontend:
  backend:
  data:

# ── Volumes ───────────────────────────────────────────────────
volumes:
  postgres_data:
  mongo_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  minio_data:
  clickhouse_data:
  neo4j_data:
  opensearch_data:

services:

# ═══════════════════════════════════════════════════════════════
# INFRASTRUCTURE
# ═══════════════════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     polymarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polymarket}
      POSTGRES_DB:       polymarket
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [data]
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polymarket"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: polymarket
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-polymarket}
    volumes:
      - mongo_data:/data/db
    networks: [data]
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks: [data, backend]
    deploy:
      resources:
        limits:
          memory: 300M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper_data:/var/lib/zookeeper
    networks: [data]
    deploy:
      resources:
        limits:
          memory: 400M
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    restart: unless-stopped
    depends_on:
      zookeeper: {condition: service_healthy}
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [data, backend]
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks: [data, backend]
    deploy:
      resources:
        limits:
          memory: 1.5G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 20s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks: [data, backend]
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.11
    restart: unless-stopped
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/db/clickhouse-init.sql:/docker-entrypoint-initdb.d/clickhouse-init.sql:ro
    networks: [data]
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 15s
      retries: 5

  neo4j:
    image: neo4j:5.25
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/polymarket123!
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
    networks: [data]
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "polymarket123!", "RETURN 1"]
      interval: 20s
      retries: 5

# ═══════════════════════════════════════════════════════════════
# SERVICES
# ═══════════════════════════════════════════════════════════════

  auth-service:
    build: ./services/auth-service
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
      kafka:    {condition: service_healthy}
    environment:
      DATABASE_URL:   postgresql://polymarket:${POSTGRES_PASSWORD:-polymarket}@postgres:5432/polymarket
      REDIS_URL:      redis://redis:6379
      KAFKA_BROKERS:  kafka:9092
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY:  ${JWT_PUBLIC_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-changeme_in_production}
      PORT: 4020
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 300M

  api-gateway:
    build: ./services/api-gateway
    restart: unless-stopped
    depends_on:
      auth-service: {condition: service_started}
      redis: {condition: service_healthy}
    environment:
      PORT:              4021
      REDIS_URL:         redis://redis:6379
      JWT_PUBLIC_KEY:    ${JWT_PUBLIC_KEY}
      FRONTEND_URL:      ${FRONTEND_URL:-http://localhost:3000}
      AUTH_SERVICE_URL:  http://auth-service:4020
      LISTING_SERVICE_URL: http://listing-service:4022
      SEARCH_SERVICE_URL:  http://search-service:4023
      IMAGE_SERVICE_URL:   http://image-service:4024
      PROFILE_SERVICE_URL: http://profile-service:4027
      PAYMENT_SERVICE_URL: http://payment-service:4026
      REVIEW_SERVICE_URL:  http://review-service:4009
      FEED_SERVICE_URL:    http://feed-service:4028
      CHAT_SERVICE_URL:    http://chat-service:4031
      ANALYTICS_SERVICE_URL: http://analytics-service:4030
      ML_SERVICE_URL:      http://ml-service:4032
      CONFIG_SERVICE_URL:  http://config-service:4034
    networks: [frontend, backend]
    ports:
      - "4021:4021"
    deploy:
      resources:
        limits:
          memory: 200M

  listing-service:
    build: ./services/listing-service
    restart: unless-stopped
    depends_on:
      mongo:  {condition: service_healthy}
      kafka:  {condition: service_healthy}
    environment:
      MONGODB_URI:    mongodb://polymarket:${MONGO_PASSWORD:-polymarket}@mongo:27017
      KAFKA_BROKERS:  kafka:9092
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      PORT: 4022
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 300M

  search-service:
    build: ./services/search-service
    restart: unless-stopped
    depends_on:
      opensearch: {condition: service_healthy}
      kafka: {condition: service_healthy}
    environment:
      OPENSEARCH_URL:  http://opensearch:9200
      KAFKA_BROKERS:   kafka:9092
      JWT_PUBLIC_KEY:  ${JWT_PUBLIC_KEY}
      PORT: 4023
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 700M

  image-service:
    build: ./services/image-service
    restart: unless-stopped
    depends_on:
      minio: {condition: service_healthy}
      kafka:  {condition: service_healthy}
    environment:
      MINIO_ENDPOINT:   http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      KAFKA_BROKERS:    kafka:9092
      PORT: 4024
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 400M

  profile-service:
    build: ./services/profile-service
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL:   jdbc:postgresql://postgres:5432/polymarket
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      PORT: 4027
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 600M

  payment-service:
    build: ./services/payment-service
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      kafka:    {condition: service_healthy}
    environment:
      DATABASE_URL:          Host=postgres;Port=5432;Database=payments;Username=polymarket;Password=${POSTGRES_PASSWORD:-polymarket}
      STRIPE_SECRET_KEY:     ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      KAFKA_BROKERS:         kafka:9092
      PORT: 4026
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 200M

  notification-service:
    build: ./services/notification-service
    restart: unless-stopped
    depends_on:
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_URL:     redis://redis:6379
      PORT: 4025
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 300M

  feed-service:
    build: ./services/feed-service
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
    environment:
      REDIS_URL: redis:6379
      PORT: 4028
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 200M

  review-service:
    build: ./services/review-service
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB_HOST:       postgres
      DB_PORT:       5432
      DB_DATABASE:   reviews
      DB_USERNAME:   polymarket
      DB_PASSWORD:   ${POSTGRES_PASSWORD:-polymarket}
      KAFKA_BROKERS: kafka:9092
      APP_KEY:       ${REVIEW_APP_KEY:-base64:changeme}
      PORT: 4029
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 250M

  analytics-service:
    build: ./services/analytics-service
    restart: unless-stopped
    depends_on:
      clickhouse: {condition: service_healthy}
      kafka:      {condition: service_healthy}
    environment:
      KAFKA_BROKERS:      kafka:9092
      CLICKHOUSE_HOST:    clickhouse
      CLICKHOUSE_PORT:    9000
      PORT: 4030
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 300M

  chat-service:
    build: ./services/chat-service
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL:    ecto://polymarket:${POSTGRES_PASSWORD:-polymarket}@postgres/chat
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-changeme_in_production}
      FRONTEND_URL:    ${FRONTEND_URL:-http://localhost:3000}
      PHX_HOST:        chat-service
      PORT: 4031
    networks: [backend, frontend]
    deploy:
      resources:
        limits:
          memory: 400M

  ml-service:
    build: ./services/ml-service
    restart: unless-stopped
    depends_on:
      neo4j: {condition: service_healthy}
    environment:
      NEO4J_URI:      bolt://neo4j:7687
      NEO4J_USER:     neo4j
      NEO4J_PASSWORD: polymarket123!
      PORT: 4032
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 500M

  stream-processor:
    build: ./services/stream-processor
    restart: unless-stopped
    depends_on:
      kafka:      {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    environment:
      KAFKA_BROKERS:       kafka:9092
      CLICKHOUSE_JDBC_URL: jdbc:clickhouse://clickhouse:8123/analytics
      PORT: 4033
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 600M

  config-service:
    build: ./services/config-service
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: Host=postgres;Port=5432;Database=config;Username=polymarket;Password=${POSTGRES_PASSWORD:-polymarket}
      PORT: 4034
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 200M

  contract-validator:
    build: ./services/contract-validator
    restart: unless-stopped
    environment:
      PORT: 4035
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 500M

  admin-panel:
    build: ./services/admin-panel
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL:    postgresql://polymarket:${POSTGRES_PASSWORD:-polymarket}@postgres:5432/polymarket
      SECRET_KEY_BASE: ${ADMIN_SECRET_KEY_BASE:-changeme_in_production}
      RAILS_ENV:       production
      PORT: 4036
    networks: [backend, frontend]
    deploy:
      resources:
        limits:
          memory: 400M

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL:    http://api-gateway:4001
      NEXT_PUBLIC_WS_URL:     ws://chat-service:4031
      HOSTNAME:               "0.0.0.0"
    networks: [frontend]
    depends_on:
      api-gateway: {condition: service_started}
    deploy:
      resources:
        limits:
          memory: 300M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "4040:80"
      - "4041:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    networks: [frontend]
    depends_on:
      api-gateway: {condition: service_started}
      frontend: {condition: service_started}
    deploy:
      resources:
        limits:
          memory: 100M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      retries: 3



  brainfuck-service:
    build: ./services/brainfuck-service
    ports: ["4050:4020"]
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 64M}

  assembly-service:
    build: ./services/assembly-service
    ports: ["4051:4021"]
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 128M}

  cobol-service:
    build: ./services/cobol-service
    ports: ["4052:4022"]
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 64M}

  clojure-service:
    build: ./services/clojure-service
    ports: ["4053:4023"]
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 400M}

  julia-service:
    build: ./services/julia-service
    ports: ["4054:4054"]
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 400M}

  prolog-service:
    build: ./services/prolog-service
    ports: ["4055:4055"]
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 128M}

  elixir-service:
    build: ./services/elixir-service
    ports: ["4057:4057"]
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 200M}

  scala-service:
    build: ./services/scala-service
    ports: ["4058:4058"]
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 512M}

  lua-service:
    build: ./services/lua-service
    ports: ["4059:4059"]
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 64M}

  r-service:
    build: ./services/r-service
    ports: ["4060:4060"]
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 512M}

  php-service:
    build: ./services/php-service
    ports: ["4061:4061"]
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 128M}

  zig-service:
    build: ./services/zig-service
    ports: ["4062:4062"]
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 64M}

  nim-service:
    build: ./services/nim-service
    ports: ["4064:4064"]
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 128M}

  swift-service:
    build: ./services/swift-service
    ports: ["4063:4063"]
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 512M}

  haskell-service:
    build: ./services/haskell-service
    ports: ["4065:4065"]
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 128M}
