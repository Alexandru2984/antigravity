openapi: "3.1.0"
info:
  title: PolyMarket Listing Service API
  version: "1.0.0"
  description: |
    Manages marketplace listings (anunțuri).
    Listings are stored in MongoDB with geo support and category-specific attributes.

servers:
  - url: http://localhost:4002
    description: Local development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateListingRequest:
      type: object
      required: [title, price, category, location]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
          example: "BMW Seria 3 2020, 150.000 km"
        description:
          type: string
          maxLength: 5000
        price:
          type: integer
          minimum: 0
          description: Price in smallest currency unit (bani for RON)
          example: 1500000
        currency:
          type: string
          enum: [RON, EUR, USD]
          default: RON
        category:
          type: string
          example: "auto"
        subcategory:
          type: string
          example: "autoturisme"
        attributes:
          type: object
          description: Category-specific fields (e.g., mileage, fuel type)
          example:
            mileage: 150000
            fuel: "benzina"
            year: 2020
            transmission: "automata"
        location:
          type: object
          required: [city, county]
          properties:
            city:
              type: string
              example: "Cluj-Napoca"
            county:
              type: string
              example: "Cluj"
            lat:
              type: number
              format: double
            lng:
              type: number
              format: double
        image_ids:
          type: array
          items:
            type: string
          description: Image IDs from image-service upload

    Listing:
      type: object
      properties:
        id:
          type: string
          description: MongoDB ObjectId as hex string
        title:
          type: string
        description:
          type: string
        price:
          type: integer
        currency:
          type: string
        category:
          type: string
        subcategory:
          type: string
        seller_id:
          type: string
          format: uuid
        images:
          type: array
          items:
            type: object
            properties:
              url:         { type: string }
              thumbnail:   { type: string }
              medium:      { type: string }
        location:
          type: object
        attributes:
          type: object
        status:
          type: string
          enum: [draft, active, sold, expired, deleted]
        views:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    ListingsPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Listing'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        has_next:
          type: boolean

paths:
  /listings:
    get:
      summary: List listings with pagination
      operationId: listListings
      parameters:
        - { name: page,     in: query, schema: { type: integer, default: 1 } }
        - { name: limit,    in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: category, in: query, schema: { type: string } }
        - { name: status,   in: query, schema: { type: string, default: active } }
        - { name: seller_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: Paginated listing results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingsPage'

    post:
      summary: Create a new listing
      operationId: createListing
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListingRequest'
      responses:
        '201':
          description: Listing created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '401':
          description: Unauthorized

  /listings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string

    get:
      summary: Get a listing by ID
      operationId: getListing
      responses:
        '200':
          description: Listing found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '404':
          description: Not found

    put:
      summary: Update a listing (seller only)
      operationId: updateListing
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListingRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '403':
          description: Forbidden (not your listing)

    delete:
      summary: Delete a listing (seller or admin)
      operationId: deleteListing
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Deleted
        '403':
          description: Forbidden

  /listings/{id}/mark-sold:
    post:
      summary: Mark listing as sold
      operationId: markSold
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Marked as sold
