syntax = "proto3";

package polymarket.listing.v1;
option go_package = "github.com/polymarket/polymarket/proto/listing/v1";

// ============================================================
// Listing Service gRPC definitions
// Used for internal service-to-service communication
// (e.g., api-gateway → listing-service for high-throughput reads)
// ============================================================

service ListingService {
  rpc GetListing     (GetListingRequest)     returns (ListingResponse);
  rpc ListListings   (ListListingsRequest)   returns (ListListingsResponse);
  rpc CreateListing  (CreateListingRequest)  returns (ListingResponse);
  rpc UpdateListing  (UpdateListingRequest)  returns (ListingResponse);
  rpc DeleteListing  (DeleteListingRequest)  returns (DeleteListingResponse);
  rpc MarkSold       (MarkSoldRequest)       returns (ListingResponse);
}

message ListingLocation {
  string city     = 1;
  string county   = 2;
  string address  = 3;
  double lat      = 4;
  double lng      = 5;
}

message ListingImage {
  string url       = 1;
  string key       = 2;
  string thumbnail = 3;
  string medium    = 4;
}

message Listing {
  string           id          = 1;
  string           title       = 2;
  string           description = 3;
  int64            price       = 4;   // in smallest currency unit
  string           currency    = 5;
  string           category    = 6;
  string           subcategory = 7;
  string           seller_id   = 8;   // UUID
  repeated ListingImage images = 9;
  ListingLocation  location    = 10;
  string           status      = 11;
  int64            views       = 12;
  string           created_at  = 13;
  string           expires_at  = 14;
}

message GetListingRequest {
  string id = 1;
}

message ListListingsRequest {
  int32  page       = 1;
  int32  limit      = 2;
  string category   = 3;
  string status     = 4;
  string seller_id  = 5;
}

message ListListingsResponse {
  repeated Listing data     = 1;
  int64            total    = 2;
  int32            page     = 3;
  int32            limit    = 4;
  bool             has_next = 5;
}

message CreateListingRequest {
  string          title       = 1;
  string          description = 2;
  int64           price       = 3;
  string          currency    = 4;
  string          category    = 5;
  string          subcategory = 6;
  string          seller_id   = 7;
  ListingLocation location    = 8;
  repeated string image_ids   = 9;
}

message UpdateListingRequest {
  string          id          = 1;
  string          seller_id   = 2;
  string          title       = 3;
  string          description = 4;
  int64           price       = 5;
  ListingLocation location    = 6;
}

message DeleteListingRequest {
  string id        = 1;
  string user_id   = 2;
  bool   is_admin  = 3;
}

message DeleteListingResponse {
  bool success = 1;
}

message MarkSoldRequest {
  string id        = 1;
  string seller_id = 2;
}

message ListingResponse {
  Listing listing = 1;
}
